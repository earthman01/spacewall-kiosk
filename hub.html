<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="HUB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070708" />
  <meta name="color-scheme" content="dark" />
  <title>HUB</title>
  <script src="./deck.js?h=fefd838ce500" defer></script>
  <script src="./nav.js" defer></script>
  <style>
    :root {
      --bg: #070708;
      --paper: #0e0e11;
      --text: #d4d4dc;
      --title: #d8d8e0;
      --muted: #6a6a74;
      --dim: #3a3a42;
      --rule: #1c1c22;
      --ok: #1aff6e;
      --amber: #ffb020;
      --proved: #7dcaa0;
      --next: #b4b4be;
      --waiting: #a08050;
      --parked: #4a4a52;
      --seed: #6a6a74;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #orbit {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      animation: pixel-orbit 220s ease-in-out infinite alternate;
    }

    header {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--rule);
      background: #050506;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.34em;
      font-size: 15px;
      color: #e4e4ea;
    }

    .brand span { color: #8e8e98; }

    .mast {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
    }

    .tag, .hint, .board-stamp {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .tag { color: var(--muted); }

    a {
      color: #7a7a84;
      text-decoration: none;
    }

    a:hover { color: #c4c4cc; }

    #north {
      flex-shrink: 0;
      padding: 16px 22px 14px;
      border-bottom: 1px solid #151518;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 70%),
        #08080a;
    }

    #north h1 {
      font-size: clamp(28px, 3.1vw, 56px);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.02;
      color: var(--title);
    }

    #north p {
      margin-top: 8px;
      max-width: 68rem;
      font-size: clamp(14px, 1.2vw, 20px);
      line-height: 1.35;
      color: #8a8a94;
    }

    #board {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px 18px;
    }

    .board-cols {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
    }

    .col {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      flex-shrink: 0;
      font-size: clamp(11px, 0.95vw, 14px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 2px;
    }

    .col-items {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      padding-bottom: 4px;
    }

    .card {
      position: relative;
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      padding: 12px 14px 10px 16px;
      background: var(--paper);
      border: 1px solid #1a1a1f;
      border-radius: 10px;
      overflow: hidden;
      color: inherit;
    }

    .card:focus-visible {
      outline: 1px solid #3a3a44;
      outline-offset: 2px;
    }

    .card .rail {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #2a2a32;
    }

    .card .status {
      font-size: clamp(11px, 0.95vw, 14px);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--dim);
    }

    .card h3 {
      font-size: clamp(15px, 1.35vw, 22px);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.12;
      color: var(--title);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .card p.detail {
      font-size: clamp(12px, 1.02vw, 15px);
      line-height: 1.3;
      color: #8a8a94;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      overflow: hidden;
    }

    .card .open-link {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6a6a78;
      width: fit-content;
    }

    .card .open-link:hover { color: #c4c4cc; }

    .note {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    .note input {
      flex: 1;
      min-width: 0;
      background: #0a0a0c;
      border: 1px solid #24242c;
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      line-height: 1.3;
      padding: 7px 9px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .note input::placeholder { color: #4a4a54; }

    .note input:focus {
      border-color: #3a3a48;
      background: #0c0c10;
    }

    .note button {
      flex-shrink: 0;
      border: 1px solid #2a2a34;
      background: #16161c;
      color: #b4b4be;
      border-radius: 6px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0 10px;
      cursor: pointer;
    }

    .note button:hover { color: #e4e4ea; border-color: #3a3a44; }
    .note button:disabled { opacity: 0.45; cursor: default; }
    .note button.ok { color: var(--ok); border-color: #1c3d28; }
    .note button.err { color: var(--amber); border-color: #5a3a0a; }

    .card.live {
      background: linear-gradient(160deg, #0b1a12 0%, #0a0e0c 100%);
      border-color: #143d24;
    }
    .card.live .rail { background: var(--ok); }
    .card.live .status { color: var(--ok); }

    .card.proved {
      background: linear-gradient(160deg, #0c1612 0%, #0c0e0d 100%);
      border-color: #1c3a2c;
    }
    .card.proved .rail { background: var(--proved); }
    .card.proved .status { color: var(--proved); }

    .card.building {
      background: linear-gradient(160deg, #1f1506 0%, #100e08 100%);
      border-color: #5a3a0a;
    }
    .card.building .rail { background: var(--amber); }
    .card.building .status { color: var(--amber); }

    .card.next {
      background: linear-gradient(160deg, #141418 0%, #0e0e11 100%);
      border-color: #2a2a32;
    }
    .card.next .rail { background: var(--next); }
    .card.next .status { color: var(--next); }

    .card.waiting {
      background: linear-gradient(160deg, #16130e 0%, #0e0e0c 100%);
      border-color: #3a3020;
    }
    .card.waiting .rail { background: var(--waiting); }
    .card.waiting .status { color: var(--waiting); }

    .card.parked {
      background: #0c0c0e;
      border-color: #222228;
    }
    .card.parked .rail { background: var(--parked); }
    .card.parked .status { color: var(--parked); }
    .card.parked h3 { color: #9a9aa4; }

    .card.seed {
      background: #0c0c0e;
      border-color: #1e1e24;
    }
    .card.seed .rail { background: var(--seed); }
    .card.seed .status { color: var(--seed); }
    .card.seed h3 { color: #b0b0b8; }

    .card.mark {
      background: linear-gradient(160deg, #2a1a08 0%, #120e08 100%);
      border-color: #a86a10;
      box-shadow: inset 0 0 0 1px rgba(255, 176, 32, 0.35);
    }
    .card.mark .rail { background: var(--amber); }
    .card.mark .status {
      color: #ffb020;
      letter-spacing: 0.08em;
    }

    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: #2e2e38; }
    .card.mark.clickable:hover { border-color: #c48420; }

    .card .status-line {
      font-size: clamp(12px, 1.02vw, 15px);
      line-height: 1.3;
      color: #c8c8d0;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
      min-width: 0;
      font-size: clamp(11px, 0.95vw, 14px);
      line-height: 1.25;
      color: #9a9aa4;
    }

    .step-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .step i {
      width: 6px;
      height: 6px;
      margin-top: 0.4em;
      border-radius: 50%;
      background: #3a3a42;
      flex: 0 0 auto;
    }

    .step .step-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: inherit;
    }

    a.step-label:hover { color: #e4e4ea; }

    .step .step-state {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5a5a64;
    }

    .step.live i { background: var(--ok); }
    .step.live .step-state { color: var(--ok); }
    .step.proved i { background: var(--proved); }
    .step.proved .step-state { color: var(--proved); }
    .step.building i { background: var(--amber); }
    .step.building .step-state { color: var(--amber); }
    .step.next i { background: var(--next); }
    .step.next .step-state { color: var(--next); }
    .step.waiting i { background: var(--waiting); }
    .step.waiting .step-state { color: var(--waiting); }
    .step.parked i { background: var(--parked); }
    .step.seed i { background: var(--seed); }
    .step.done { color: #5c5c66; }
    .step.done .step-row .step-label { text-decoration: line-through; }

    .step-links {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-left: 14px;
    }

    .step-links a {
      color: #b4b4be;
      text-decoration: none;
    }

    .step-links a:hover { color: #e4e4ea; }
    .step.mark {
      color: #ffe0a8;
      background: rgba(255, 176, 32, 0.1);
      border: 1px solid rgba(255, 176, 32, 0.35);
      border-radius: 6px;
      padding: 3px 6px;
    }
    .step.mark i { background: var(--amber); }
    .step.mark .step-state { color: #ffb020; }

    .oversee {
      flex-shrink: 0;
      border: 1px solid #1a1a1f;
      border-radius: 10px;
      background: #0c0c0e;
    }

    .oversee-toggle {
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      background: none;
      border: 0;
      color: #6a6a74;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 12px;
      cursor: pointer;
    }

    .oversee-toggle:hover { color: #c4c4cc; }
    .oversee-toggle:focus-visible {
      outline: 1px solid #3a3a44;
      outline-offset: -2px;
    }

    .oversee-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 10px;
    }

    .oversee-list[hidden] { display: none !important; }

    .oversee-item {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      background: #121216;
      border: 1px solid #222228;
      color: #9a9aa4;
      border-radius: 10px;
      font: inherit;
      font-size: 12px;
      line-height: 1.25;
      padding: 5px 10px;
      cursor: pointer;
      text-align: left;
    }

    .oversee-line {
      font-size: 11px;
      letter-spacing: 0.01em;
      color: #8a8a94;
    }

    .oversee-item:hover { color: #e4e4ea; border-color: #3a3a44; }

    #task-reader {
      position: fixed;
      inset: 0;
      z-index: 10050;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      background: rgba(7, 7, 8, 0.78);
    }

    #task-reader[hidden] { display: none !important; }

    .task-sheet {
      width: min(52rem, 100%);
      max-height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 28%),
        var(--paper);
      border: 1px solid #1a1a1f;
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      padding: 22px 26px 28px;
      user-select: text;
      -webkit-user-select: text;
    }

    .task-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .task-back {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .task-back:hover { color: #d0d0d8; }

    .task-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--next);
    }

    .task-kicker.mark { color: #ffb020; }

    #task-title {
      margin-top: 8px;
      font-size: clamp(26px, 3vw, 42px);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--title);
    }

    .task-status-line,
    .task-detail {
      margin-top: 12px;
      font-size: clamp(15px, 1.2vw, 18px);
      line-height: 1.4;
      color: #c8c8d0;
    }

    .task-detail { color: #8a8a94; }

    .task-steps { margin-top: 16px; gap: 6px; }

    .task-photos {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .task-photos figure { margin: 0; }

    .task-photos img {
      width: 100%;
      height: auto;
      max-height: 42vh;
      object-fit: contain;
      background: #08080a;
      border-radius: 8px;
      border: 1px solid #1a1a1f;
    }

    .task-photos figcaption {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: #6a6a74;
    }

    .task-note {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #1a1a20;
    }

    .task-note .note { margin-top: 8px; }

    .task-note-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .ver {
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 4;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3a3a42;
      pointer-events: none;
    }

    .views {
      display: flex;
      gap: 14px;
    }

    .views button {
      appearance: none;
      -webkit-appearance: none;
      background: none;
      border: 0;
      padding: 4px 0 5px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      cursor: pointer;
    }

    .views button[aria-selected="true"] {
      color: #e4e4ea;
      box-shadow: inset 0 -1px 0 #8a8a94;
    }

    .views button:hover { color: #c4c4cc; }

    .views button:focus-visible {
      outline: 1px solid #3a3a44;
      outline-offset: 3px;
    }

    #board[hidden],
    #calendar[hidden],
    #cal-reader[hidden] {
      display: none !important;
    }

    #calendar {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px 22px 36px;
    }

    .cal-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .cal-list {
      width: min(880px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .day {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button.cal-card {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    button.cal-card:hover { border-color: #2e2e38; }

    .cal-card .when,
    .cal-when,
    .cal-where {
      font-variant-numeric: tabular-nums;
    }

    .cal-card .when {
      font-size: clamp(12px, 1.05vw, 16px);
      letter-spacing: 0.02em;
      color: #9a9aa4;
    }

    .cal-card .leave-line {
      font-size: clamp(14px, 1.25vw, 20px);
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--title);
    }

    .cal-card .leave-line.pending {
      color: var(--amber);
      font-weight: 600;
    }

    #cal-reader {
      position: fixed;
      inset: 0;
      z-index: 10050;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      background: rgba(7, 7, 8, 0.78);
    }

    body.reader-open { overflow: hidden; }
    body.reader-open #orbit { pointer-events: none; }

    .cal-sheet {
      width: min(40rem, 100%);
      max-height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 28%),
        var(--paper);
      border: 1px solid #1a1a1f;
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      padding: 22px 26px 28px;
      user-select: text;
      -webkit-user-select: text;
    }

    .cal-bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .cal-back,
    .cal-map {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .cal-back:hover,
    .cal-map:hover { color: #d0d0d8; }

    .cal-map { color: #6a6a78; }

    .cal-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--next);
    }

    #cal-title {
      margin-top: 8px;
      font-size: clamp(26px, 3vw, 44px);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--title);
    }

    .cal-when {
      margin-top: 10px;
      font-size: clamp(14px, 1.2vw, 18px);
      color: #9a9aa4;
    }

    .cal-where {
      margin-top: 4px;
      font-size: clamp(14px, 1.15vw, 18px);
      line-height: 1.35;
      color: #8a8a94;
    }

    .cal-leave {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #1a1a20;
    }

    .cal-leave-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
    }

    .cal-leave-time {
      margin-top: 6px;
      font-size: clamp(32px, 4vw, 56px);
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--title);
      font-variant-numeric: tabular-nums;
    }

    .cal-leave.pending .cal-leave-time {
      font-size: clamp(22px, 2.4vw, 32px);
      color: var(--amber);
    }

    .cal-leave-meta,
    .cal-detail {
      margin-top: 10px;
      font-size: clamp(14px, 1.15vw, 17px);
      line-height: 1.4;
      color: #8a8a94;
    }

    .cal-detail { margin-top: 18px; }

    @keyframes pixel-orbit {
      from { transform: translate3d(-6px, -5px, 0); }
      to { transform: translate3d(7px, 6px, 0); }
    }

    @media (max-height: 820px) {
      header { padding: 10px 16px 8px; }
      #north { padding: 10px 16px 8px; }
      #north h1 { font-size: clamp(22px, 2.6vw, 36px); }
      #north p {
        margin-top: 4px;
        font-size: clamp(13px, 1.15vw, 16px);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      #board { padding: 8px 12px 14px; gap: 6px; }
      .board-cols { gap: 8px; }
      #calendar { padding: 8px 16px 28px; }
      .card { padding: 8px 10px 8px 14px; gap: 2px; }
      .card p.detail { -webkit-line-clamp: 4; }
    }

    @media (max-width: 1080px) and (orientation: portrait) {
      html, body { overflow: auto; }
      #orbit { height: auto; min-height: 100dvh; animation: none; }
      #calendar { overflow: visible; }
      .board-cols {
        grid-auto-flow: row;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: none;
        overflow: visible;
      }
      .col-items { overflow: visible; }
      .card { flex: 0 0 auto; min-height: 0; }
    }

    @media (max-width: 700px) {
      header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .mast { align-items: flex-start; }
      #board { padding-bottom: 48px; }
      .board-cols { grid-template-columns: 1fr; }
      .task-photos { grid-template-columns: 1fr; }
      .task-sheet { padding: 18px 16px 24px; }
      #calendar { padding-bottom: 48px; overflow: visible; }
      .cal-sheet { padding: 18px 16px 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #orbit { animation-duration: 400s; }
    }
  </style>
</head>
<body>
  <div id="orbit">
    <header>
      <div class="brand">HU<span>B</span></div>
      <div class="mast">
        <div class="views" role="tablist" aria-label="Hub view">
          <button type="button" id="tab-board" role="tab" aria-selected="true" aria-controls="board">Board</button>
          <button type="button" id="tab-calendar" role="tab" aria-selected="false" aria-controls="calendar">Calendar</button>
        </div>
        <div class="tag" id="subtitle">personal os</div>
        <div class="board-stamp" id="board-stamp">board · —</div>
        <div class="hint"></div>
      </div>
    </header>

    <section id="north" aria-label="North star">
      <h1 id="ns-headline">—</h1>
      <p id="ns-body"></p>
    </section>

    <main id="board" role="tabpanel" aria-labelledby="tab-board" aria-live="polite" aria-label="Planning board"></main>
    <main id="calendar" role="tabpanel" aria-labelledby="tab-calendar" aria-live="polite" aria-label="Calendar" hidden>
      <div class="cal-head">
        <h2 class="col-label" id="cal-heading">Upcoming</h2>
        <div class="board-stamp" id="cal-stamp"></div>
      </div>
      <div class="cal-list" id="cal-list"></div>
    </main>
  </div>
  <div id="cal-reader" role="dialog" aria-modal="true" aria-labelledby="cal-title" hidden>
    <div class="cal-sheet">
      <div class="cal-bar">
        <button type="button" class="cal-back" id="cal-back">← calendar</button>
        <a class="cal-map" id="cal-map" href="#" rel="noopener noreferrer" target="_blank" hidden>Map</a>
      </div>
      <div class="cal-kicker" id="cal-kicker"></div>
      <h2 id="cal-title"></h2>
      <p class="cal-when" id="cal-when"></p>
      <p class="cal-where" id="cal-where" hidden></p>
      <div class="cal-leave" id="cal-leave" hidden>
        <div class="cal-leave-kicker">Leave by</div>
        <div class="cal-leave-time" id="cal-leave-time"></div>
        <p class="cal-leave-meta" id="cal-leave-meta" hidden></p>
      </div>
      <p class="cal-detail" id="cal-detail" hidden></p>
    </div>
  </div>
  <div id="task-reader" role="dialog" aria-modal="true" aria-labelledby="task-title" hidden>
    <div class="task-sheet">
      <div class="task-bar">
        <button type="button" class="task-back" id="task-back">← board</button>
      </div>
      <div class="task-kicker" id="task-kicker"></div>
      <h2 id="task-title"></h2>
      <p class="task-status-line" id="task-status-line" hidden></p>
      <p class="task-detail" id="task-detail" hidden></p>
      <div class="steps task-steps" id="task-steps" hidden></div>
      <div class="task-photos" id="task-photos" hidden></div>
      <div class="task-note">
        <div class="task-note-label">Message earthbot</div>
        <div id="task-note"></div>
      </div>
    </div>
  </div>
  <div id="ver" class="ver" data-portal="HUB">HUB 26.44.3.1</div>

  <script>
(function () {
  const VERSION_CHECK_MS = 3 * 60 * 1000;
  const BOARD_REFRESH_MS = 20 * 60 * 1000;
  const NOTE_TIMEOUT_MS = 8000;
  // Public Form.taxi endpoint only. It emails earthbot@mail.grokbot.com.
  // No API key, and no sendm8 / FormSubmit fallback.
  const FORM_TAXI = {
    name: "form.taxi",
    url: "https://form.taxi/s/rvzzhd31"
  };
  const KNOWN = {
    live: "Live",
    proved: "Proved",
    building: "Building",
    next: "Next",
    waiting: "Waiting",
    parked: "Parked",
    seed: "Seed",
    mark: "Waiting on Mark",
    done: "Done",
    archived: "Archived"
  };

  const board = document.getElementById("board");
  const headlineEl = document.getElementById("ns-headline");
  const bodyEl = document.getElementById("ns-body");
  const subtitleEl = document.getElementById("subtitle");
  const boardStampEl = document.getElementById("board-stamp");

  let lastGood = null;
  let loadedVersion = null;
  let reloadArmed = false;
  let boardTimer = null;

  function pageIsVisible() {
    return document.visibilityState === "visible";
  }

  function statusKey(raw) {
    const k = String(raw || "").trim().toLowerCase();
    return Object.prototype.hasOwnProperty.call(KNOWN, k) ? k : "seed";
  }

  function statusLabel(raw) {
    const k = String(raw || "").trim().toLowerCase();
    if (Object.prototype.hasOwnProperty.call(KNOWN, k)) return KNOWN[k];
    const shown = String(raw || "").trim();
    return shown || "Seed";
  }

  function safeUrl(url) {
    if (!url || typeof url !== "string") return null;
    try {
      const u = new URL(url, location.href);
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function formatBoardTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    try {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(d) + " CT";
    } catch (e) {
      return d.toISOString();
    }
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function isDoneStatus(raw) {
    const k = String(raw || "").trim().toLowerCase();
    return k === "done" || k === "archived";
  }

  function safePhoto(src) {
    if (!src || typeof src !== "string") return null;
    const trimmed = src.trim();
    if (!trimmed || trimmed.indexOf("..") !== -1) return null;
    if (/^https?:\/\//i.test(trimmed)) return safeUrl(trimmed);
    if (/^hub-media\/[A-Za-z0-9._-]+$/.test(trimmed)) return trimmed;
    return null;
  }

  function normalizeLink(raw) {
    if (!raw || typeof raw !== "object") return null;
    const url = safeUrl(raw.url);
    const label = String(raw.label || "").trim();
    if (!url || !label) return null;
    return { label: label, url: url };
  }

  function normalizeStep(raw) {
    if (!raw || typeof raw !== "object") return null;
    const label = String(raw.label || raw.title || "").trim();
    if (!label) return null;
    const given = String(raw.status || "").trim();
    const status = given ? statusKey(given) : "";
    const links = [];
    if (Array.isArray(raw.links)) {
      raw.links.forEach(function (link) {
        const item = normalizeLink(link);
        if (item) links.push(item);
      });
    }
    const ownUrl = safeUrl(raw.url);
    if (ownUrl && !links.length) links.push({ label: label, url: ownUrl });
    return {
      id: String(raw.id || ""),
      label: label,
      status: status,
      labelStatus: given ? statusLabel(given) : "",
      url: ownUrl,
      links: links,
      show: raw.show === true,
      done: raw.done === true || raw.archived === true || isDoneStatus(raw.status)
    };
  }

  function normalizeItem(raw) {
    if (!raw || typeof raw !== "object") return null;
    const title = String(raw.title || "").trim();
    if (!title) return null;
    const steps = Array.isArray(raw.steps) ? raw.steps.map(normalizeStep).filter(Boolean) : [];
    const photos = Array.isArray(raw.photos) ? raw.photos.map(function (photo) {
      if (!photo || typeof photo !== "object") return null;
      const src = safePhoto(photo.src);
      if (!src) return null;
      return { src: src, alt: String(photo.alt || title).trim() || title };
    }).filter(Boolean) : [];
    return {
      id: String(raw.id || ""),
      title: title,
      status: statusKey(raw.status),
      label: statusLabel(raw.status),
      statusText: String(raw.status_text || "").trim(),
      detail: String(raw.detail || "").trim(),
      url: safeUrl(raw.url),
      archived: raw.archived === true || raw.done === true || isDoneStatus(raw.status),
      steps: steps,
      photos: photos
    };
  }

  function hasOpenWork(item) {
    if (!item || item.archived) return false;
    if (item.steps.length) return item.steps.some(function (step) { return !step.done; });
    return true;
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      const t = setTimeout(function () { reject(new Error("timeout")); }, ms);
      promise.then(function (v) { clearTimeout(t); resolve(v); },
                   function (e) { clearTimeout(t); reject(e); });
    });
  }

  function notePayload(item, text) {
    return {
      _subject: "[HUB] " + item.title,
      message: text,
      item_id: item.id || "",
      item_title: item.title,
      source: "hub",
      page: location.href.split("?")[0]
    };
  }

  async function postNote(item, text) {
    const res = await withTimeout(fetch(FORM_TAXI.url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(notePayload(item, text))
    }), NOTE_TIMEOUT_MS);
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok || !data || data.success !== true) {
      const err = new Error("form.taxi HTTP " + res.status);
      err.status = res.status;
      throw err;
    }
    return res.status;
  }

  function markSent(btn, input) {
    btn.textContent = "Sent";
    btn.classList.add("ok");
    btn.classList.remove("err");
    input.value = "";
    setTimeout(function () {
      btn.textContent = "Send";
      btn.classList.remove("ok");
      btn.disabled = false;
    }, 1800);
  }

  function markFailed(btn) {
    btn.textContent = "Failed";
    btn.classList.add("err");
    btn.classList.remove("ok");
    btn.disabled = false;
    setTimeout(function () {
      if (btn.textContent !== "Failed") return;
      btn.textContent = "Send";
      btn.classList.remove("err");
    }, 4000);
  }

  async function sendNote(item, text, btn, input) {
    btn.disabled = true;
    btn.textContent = "…";
    btn.classList.remove("ok", "err");
    try {
      await postNote(item, text);
      markSent(btn, input);
    } catch (err) {
      markFailed(btn);
    }
  }

  function renderNote(item) {
    const row = document.createElement("form");
    row.className = "note";
    row.setAttribute("action", FORM_TAXI.url);
    row.setAttribute("method", "POST");
    const input = document.createElement("input");
    input.type = "text";
    input.name = "message";
    input.autocomplete = "off";
    input.spellcheck = true;
    input.maxLength = 500;
    input.placeholder = "note → earthbot";
    input.setAttribute("aria-label", "Note for " + item.title);
    const btn = document.createElement("button");
    btn.type = "submit";
    btn.textContent = "Send";
    row.appendChild(input);
    row.appendChild(btn);
    row.addEventListener("submit", function (ev) {
      ev.preventDefault();
      const text = String(input.value || "").trim();
      if (!text) {
        input.focus();
        return;
      }
      sendNote(item, text, btn, input);
    });
    return row;
  }

  const taskReader = document.getElementById("task-reader");
  const taskBack = document.getElementById("task-back");
  const taskKicker = document.getElementById("task-kicker");
  const taskTitle = document.getElementById("task-title");
  const taskStatusLine = document.getElementById("task-status-line");
  const taskDetail = document.getElementById("task-detail");
  const taskSteps = document.getElementById("task-steps");
  const taskPhotos = document.getElementById("task-photos");
  const taskNote = document.getElementById("task-note");
  let taskReturn = null;

  function showBlock(el, text) {
    el.hidden = !text;
    el.textContent = text || "";
  }

  function closeTask() {
    if (!taskReader || taskReader.hidden) return;
    taskReader.hidden = true;
    const cal = document.getElementById("cal-reader");
    if (!cal || cal.hidden) document.body.classList.remove("reader-open");
    const back = taskReturn;
    taskReturn = null;
    if (back && back.focus) back.focus();
  }

  function openTask(item) {
    if (!taskReader || !item) return;
    taskReturn = document.activeElement;
    taskKicker.textContent = item.label;
    taskKicker.classList.toggle("mark", item.status === "mark");
    taskTitle.textContent = item.title;
    showBlock(taskStatusLine, item.statusText);
    showBlock(taskDetail, item.detail);
    clear(taskSteps);
    const steps = renderSteps(item.steps, true);
    taskSteps.hidden = !steps;
    if (steps) taskSteps.appendChild(steps);
    clear(taskPhotos);
    taskPhotos.hidden = !item.photos.length;
    item.photos.forEach(function (photo) {
      const fig = document.createElement("figure");
      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.alt;
      const cap = document.createElement("figcaption");
      cap.textContent = photo.alt;
      fig.appendChild(img);
      fig.appendChild(cap);
      taskPhotos.appendChild(fig);
    });
    clear(taskNote);
    taskNote.appendChild(renderNote(item));
    taskReader.hidden = false;
    document.body.classList.add("reader-open");
    taskBack.focus();
  }

  if (taskBack) taskBack.addEventListener("click", closeTask);
  if (taskReader) {
    taskReader.addEventListener("click", function (ev) {
      if (ev.target === taskReader) closeTask();
    });
  }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && taskReader && !taskReader.hidden) {
      ev.preventDefault();
      closeTask();
    }
  });

  function renderSteps(steps, includeDone) {
    const list = document.createElement("div");
    list.className = "steps";
    steps.forEach(function (step) {
      if (!includeDone && step.done && !step.show && !step.links.length) return;
      const row = document.createElement("div");
      row.className = "step " + step.status;
      const line = document.createElement("div");
      line.className = "step-row";
      const dot = document.createElement("i");
      dot.setAttribute("aria-hidden", "true");
      const label = (!step.links.length && step.url) ? document.createElement("a") : document.createElement("span");
      label.className = "step-label";
      label.textContent = step.label;
      if (label.tagName === "A") {
        label.href = step.url;
        label.target = "_blank";
        label.rel = "noopener noreferrer";
      }
      line.appendChild(dot);
      line.appendChild(label);
      if (step.done || step.labelStatus) {
        const state = document.createElement("span");
        state.className = "step-state";
        state.textContent = step.done ? "Done" : step.labelStatus;
        line.appendChild(state);
      }
      row.appendChild(line);
      if (step.links.length && !(step.links.length === 1 && step.links[0].label === step.label)) {
        const links = document.createElement("div");
        links.className = "step-links";
        step.links.forEach(function (link) {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = link.label;
          links.appendChild(a);
        });
        row.appendChild(links);
      }
      list.appendChild(row);
    });
    return list.childNodes.length ? list : null;
  }

  function renderCard(item) {
    const el = document.createElement("article");
    el.className = "card clickable " + item.status;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", item.title);
    if (item.id) el.dataset.id = item.id;
    const rail = document.createElement("div");
    rail.className = "rail";
    rail.setAttribute("aria-hidden", "true");
    const status = document.createElement("div");
    status.className = "status";
    status.textContent = item.label;
    const title = document.createElement("h3");
    title.textContent = item.title;
    el.appendChild(rail);
    el.appendChild(status);
    el.appendChild(title);
    if (item.statusText) {
      const line = document.createElement("p");
      line.className = "status-line";
      line.textContent = item.statusText;
      el.appendChild(line);
    }
    const openSteps = renderSteps(item.steps, false);
    if (openSteps) el.appendChild(openSteps);
    if (item.detail) {
      const detail = document.createElement("p");
      detail.className = "detail";
      detail.textContent = item.detail;
      el.appendChild(detail);
    }
    if (item.url) {
      const link = document.createElement("a");
      link.className = "open-link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Open";
      el.appendChild(link);
    }
    el.appendChild(renderNote(item));
    el.addEventListener("click", function (ev) {
      const t = ev.target;
      if (t && t.closest && t.closest("form, a, button, input, textarea")) return;
      openTask(item);
    });
    el.addEventListener("keydown", function (ev) {
      if (ev.key !== "Enter" && ev.key !== " ") return;
      if (ev.target !== el) return;
      ev.preventDefault();
      openTask(item);
    });
    return el;
  }

  function renderColumn(col) {
    const section = document.createElement("section");
    section.className = "col";
    if (col && col.id) section.dataset.col = String(col.id);
    const label = document.createElement("h2");
    label.className = "col-label";
    label.textContent = (col && (col.label || col.id)) || "";
    const items = document.createElement("div");
    items.className = "col-items";
    const rawItems = col && Array.isArray(col.items) ? col.items : [];
    const cards = rawItems.map(normalizeItem).filter(Boolean).filter(hasOpenWork);
    if (!cards.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "—";
      items.appendChild(empty);
    } else {
      cards.forEach(function (item) { items.appendChild(renderCard(item)); });
    }
    section.appendChild(label);
    section.appendChild(items);
    return section;
  }

  function paintBoardStamp(data) {
    if (!boardStampEl) return;
    const when = formatBoardTime(data && data.updated_at);
    boardStampEl.textContent = when ? "board · " + when : "board · visible only";
  }

  let itemsById = {};

  function indexItems(data) {
    const map = {};
    const columns = data && Array.isArray(data.columns) ? data.columns : [];
    columns.forEach(function (col) {
      const rawItems = col && Array.isArray(col.items) ? col.items : [];
      rawItems.forEach(function (raw) {
        const item = normalizeItem(raw);
        if (item && item.id) map[item.id] = item;
      });
    });
    const watch = data && data.watch && Array.isArray(data.watch.items) ? data.watch.items : [];
    watch.forEach(function (raw) {
      const item = normalizeItem(raw);
      if (item && item.id && !map[item.id]) map[item.id] = item;
    });
    itemsById = map;
  }

  function resolveWatch(raw) {
    if (!raw || typeof raw !== "object") return null;
    const id = String(raw.id || "").trim();
    if (id && itemsById[id] && !String(raw.title || "").trim()) return itemsById[id];
    const item = normalizeItem(raw);
    if (item) return item;
    return id && itemsById[id] ? itemsById[id] : null;
  }

  function renderOversee(watch) {
    const items = (watch.items || []).map(resolveWatch).filter(Boolean);
    const wrap = document.createElement("section");
    wrap.className = "oversee";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "oversee-toggle";
    toggle.setAttribute("aria-expanded", "false");
    const title = document.createElement("span");
    title.textContent = String(watch.title || "Everything we oversee");
    const count = document.createElement("span");
    count.textContent = String(items.length);
    toggle.appendChild(title);
    toggle.appendChild(count);
    const list = document.createElement("div");
    list.className = "oversee-list";
    list.hidden = true;
    items.forEach(function (item) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "oversee-item";
      const name = document.createElement("span");
      name.textContent = item.title;
      btn.appendChild(name);
      if (item.statusText) {
        const line = document.createElement("span");
        line.className = "oversee-line";
        line.textContent = item.statusText;
        btn.appendChild(line);
      }
      btn.addEventListener("click", function () { openTask(item); });
      list.appendChild(btn);
    });
    toggle.addEventListener("click", function () {
      const open = list.hidden;
      list.hidden = !open;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    wrap.appendChild(toggle);
    wrap.appendChild(list);
    return wrap;
  }

  function renderBoard(data) {
    const ns = (data && data.north_star) || {};
    headlineEl.textContent = String(ns.headline || "—");
    bodyEl.textContent = String(ns.body || "");
    if (subtitleEl) subtitleEl.textContent = String((data && data.subtitle) || "personal os");
    paintBoardStamp(data);
    indexItems(data);
    clear(board);
    const cols = document.createElement("div");
    cols.className = "board-cols";
    const columns = data && Array.isArray(data.columns) ? data.columns : [];
    columns.forEach(function (col) { cols.appendChild(renderColumn(col)); });
    board.appendChild(cols);
    const watch = data && data.watch && typeof data.watch === "object" ? data.watch : null;
    if (watch && Array.isArray(watch.items) && watch.items.length) {
      board.appendChild(renderOversee(watch));
    }
  }

  function validBoard(data) {
    return data && typeof data === "object" && Array.isArray(data.columns);
  }

  function applyBoard(data) {
    if (!validBoard(data)) return false;
    renderBoard(data);
    lastGood = data;
    return true;
  }

  function boardUrl() {
    const q = new URLSearchParams();
    q.set("t", String(Date.now()));
    if (loadedVersion) q.set("v", loadedVersion);
    return "./hub-board.json?" + q.toString();
  }

  const PORTALS_FALLBACK = {
    updated_at: "2026-10-30T19:20:00Z",
    source: "portals-fallback",
    title: "HUB",
    subtitle: "SPACEWALL · boards",
    north_star: {
      headline: "Every board, one tap",
      body: "Guest welcome, ops wall, room portals, press, and reel — same nav on every page."
    },
    columns: [
      { id: "guest", label: "Guest", items: [
        { id: "lisa", title: "Welcome, Lisa", status: "live", detail: "Dinner menu, bots, brief, wall boards.", url: "./welcome-lisa.html" },
        { id: "rich", title: "Welcome, Rich", status: "live", detail: "Guest welcome with live clock.", url: "./rich.html" }
      ]},
      { id: "walls", label: "Walls", items: [
        { id: "spacewall", title: "SPACEWALL", status: "live", detail: "Ops status board.", url: "./" },
        { id: "press", title: "PRESS", status: "live", detail: "Floating newspaper.", url: "./press.html" },
        { id: "hub", title: "HUB", status: "live", detail: "This portal map.", url: "./hub.html" }
      ]},
      { id: "room", label: "Room", items: [
        { id: "hearth", title: "HEARTH", status: "live", detail: "OLED room portal.", url: "./hearth.html" },
        { id: "wave", title: "WAVE", status: "live", detail: "Idle wave lab.", url: "./wave.html" },
        { id: "reel", title: "REEL", status: "live", detail: "Cinema float packs.", url: "./reel.html" }
      ]},
      { id: "home", label: "Home", items: [
        { id: "portal-home", title: "Portal home", status: "live", detail: "Link list of every board.", url: "./portal-home.html" }
      ]}
    ],
    watch: { title: "Portals", items: [
      { id: "w-lisa", title: "Lisa", status: "live", detail: "Guest", url: "./welcome-lisa.html" },
      { id: "w-sw", title: "SPACEWALL", status: "live", detail: "Ops", url: "./" },
      { id: "w-press", title: "PRESS", status: "live", detail: "Brief", url: "./press.html" },
      { id: "w-reel", title: "REEL", status: "live", detail: "Cinema", url: "./reel.html" }
    ]}
  };

  async function loadBoard() {
    if (!pageIsVisible()) return;
    try {
      const res = await fetch(boardUrl(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (applyBoard(data)) return;
      if (lastGood) { applyBoard(lastGood); return; }
      applyBoard(PORTALS_FALLBACK);
    } catch (e) {
      if (lastGood) applyBoard(lastGood);
      else applyBoard(PORTALS_FALLBACK);
    }
  }

  function disarmBoardRefresh() {
    if (boardTimer) {
      clearInterval(boardTimer);
      boardTimer = null;
    }
  }

  function armBoardRefresh() {
    disarmBoardRefresh();
    if (!pageIsVisible()) return;
    boardTimer = setInterval(function () {
      if (!pageIsVisible()) {
        disarmBoardRefresh();
        return;
      }
      loadBoard();
    }, BOARD_REFRESH_MS);
  }

  document.addEventListener("visibilitychange", function () {
    if (pageIsVisible()) {
      loadBoard();
      armBoardRefresh();
    } else {
      disarmBoardRefresh();
    }
  });

  if (pageIsVisible()) {
    loadBoard();
    armBoardRefresh();
  }

  function versionCheckMs() {
    try {
      const raw = new URLSearchParams(location.search).get("vcheck");
      const n = raw ? Number(raw) : NaN;
      if (Number.isFinite(n) && n >= 1000) return n;
    } catch (e) {}
    return VERSION_CHECK_MS;
  }

  function paintStamp(data) {
    const el = document.getElementById("ver");
    if (!el || !data || !data.label) return;
    const name = el.getAttribute("data-portal") || "HUB";
    el.textContent = name + " " + data.label;
  }

  async function fetchVersion() {
    const url = "./version.json?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || typeof data.v !== "string" || !data.v) {
      throw new Error("bad version");
    }
    paintStamp(data);
    return data.v;
  }

  async function captureVersion() {
    try {
      loadedVersion = await fetchVersion();
    } catch (e) {
      loadedVersion = null;
    }
  }

  async function checkVersion() {
    if (reloadArmed) return;
    try {
      const remote = await fetchVersion();
      if (loadedVersion == null) {
        loadedVersion = remote;
        return;
      }
      if (remote !== loadedVersion) {
        reloadArmed = true;
        location.reload();
      }
    } catch (e) {}
  }

  captureVersion();
  setInterval(checkVersion, versionCheckMs());
})();

  <script>
(function () {
  const CAL_REFRESH_MS = 20 * 60 * 1000;
  const DEFAULT_TZ = "America/Chicago";
  const KINDS = {
    appointment: "Appointment",
    event: "Event",
    reminder: "Reminder"
  };

  const tabBoard = document.getElementById("tab-board");
  const tabCalendar = document.getElementById("tab-calendar");
  const board = document.getElementById("board");
  const calendar = document.getElementById("calendar");
  const listEl = document.getElementById("cal-list");
  const stampEl = document.getElementById("cal-stamp");
  const reader = document.getElementById("cal-reader");
  const backBtn = document.getElementById("cal-back");
  const mapEl = document.getElementById("cal-map");
  const kickerEl = document.getElementById("cal-kicker");
  const titleEl = document.getElementById("cal-title");
  const whenEl = document.getElementById("cal-when");
  const whereEl = document.getElementById("cal-where");
  const leaveEl = document.getElementById("cal-leave");
  const leaveTimeEl = document.getElementById("cal-leave-time");
  const leaveMetaEl = document.getElementById("cal-leave-meta");
  const detailEl = document.getElementById("cal-detail");

  let tz = DEFAULT_TZ;
  let lastGood = null;
  let timer = null;
  let openId = "";
  let returnFocus = null;

  function pageIsVisible() {
    return document.visibilityState === "visible";
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function parseTime(iso) {
    if (!iso || typeof iso !== "string") return null;
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function finiteNumber(n) {
    const x = typeof n === "number" ? n : (typeof n === "string" && String(n).trim() !== "" ? Number(n) : NaN);
    return Number.isFinite(x) && x >= 0 ? x : null;
  }

  function safeUrl(url) {
    if (!url || typeof url !== "string") return null;
    try {
      const u = new URL(url, location.href);
      if (u.protocol !== "https:" && u.protocol !== "http:") return null;
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function setZone(next) {
    if (!next || typeof next !== "string") return;
    try {
      new Intl.DateTimeFormat("en-US", { timeZone: next }).format(new Date());
      tz = next;
    } catch (e) {}
  }

  function zoneSuffix() {
    return tz === DEFAULT_TZ ? " CT" : "";
  }

  function ymd(date) {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: tz,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(date);
  }

  function addDays(ymdStr, n) {
    const parts = ymdStr.split("-").map(Number);
    const utc = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2] + n));
    const y = utc.getUTCFullYear();
    const m = String(utc.getUTCMonth() + 1).padStart(2, "0");
    const d = String(utc.getUTCDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  function formatClock(date) {
    const t = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).format(date);
    return t + zoneSuffix();
  }

  function formatStamp(iso) {
    const d = parseTime(iso);
    if (!d) return "";
    try {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(d) + zoneSuffix();
    } catch (e) {
      return "";
    }
  }

  function kindLabel(kind) {
    if (Object.prototype.hasOwnProperty.call(KINDS, kind)) return KINDS[kind];
    const shown = String(kind || "").trim();
    return shown || "Event";
  }

  function formatSpan(mins) {
    const whole = Math.round(mins);
    const h = Math.floor(whole / 60);
    const m = whole % 60;
    if (h && m) return h + " hr " + m + " min";
    if (h) return h + " hr";
    return m + " min";
  }

  function normalizeEvent(raw) {
    if (!raw || typeof raw !== "object") return null;
    const title = String(raw.title || "").trim();
    const starts = parseTime(raw.starts_at);
    if (!title || !starts) return null;
    const location = String(raw.location || "").trim();
    const address = String(raw.address || "").trim();
    const kindRaw = String(raw.kind || "").trim().toLowerCase();
    return {
      id: String(raw.id || "").trim(),
      title: title,
      kind: kindRaw || (location || address ? "appointment" : "event"),
      starts: starts,
      ends: parseTime(raw.ends_at),
      allDay: raw.all_day === true,
      location: location,
      address: address,
      detail: String(raw.detail || "").trim(),
      drive: finiteNumber(raw.drive_minutes),
      buffer: finiteNumber(raw.buffer_minutes),
      driveApprox: raw.drive_approx === true,
      distance: finiteNumber(raw.distance_miles),
      leaveBy: parseTime(raw.leave_by),
      url: safeUrl(raw.url)
    };
  }

  function isUpcoming(event, now) {
    if (event.ends) return event.ends.getTime() >= now.getTime();
    return ymd(event.starts) >= ymd(now);
  }

  function resolveLeave(event, fileBuffer) {
    if (!event.location && !event.address) return null;
    const buffer = event.buffer != null ? event.buffer : (fileBuffer != null ? fileBuffer : 0);
    let computed = null;
    if (event.drive != null && !event.allDay) {
      computed = new Date(event.starts.getTime() - (event.drive + buffer) * 60000);
    }
    const at = event.leaveBy || computed;
    return {
      at: at,
      pending: !at,
      drive: event.drive,
      buffer: buffer,
      approx: event.driveApprox,
      distance: event.distance
    };
  }

  function leaveMeta(info) {
    if (!info || info.pending) return "";
    const parts = [];
    if (info.drive != null) {
      parts.push((info.approx ? "about " : "") + formatSpan(info.drive) + " drive");
    }
    if (info.distance != null) parts.push(Math.round(info.distance) + " mi");
    if (info.buffer) parts.push(formatSpan(info.buffer) + " buffer");
    return parts.join(" · ");
  }

  function whereLine(event) {
    if (event.address) return event.address;
    if (event.location && event.location !== event.title) return event.location;
    return "";
  }

  function cardWhen(event) {
    if (event.allDay) return "All day";
    if (event.ends && ymd(event.ends) === ymd(event.starts)) {
      const suffix = zoneSuffix();
      const start = formatClock(event.starts).replace(suffix, "");
      return start + "–" + formatClock(event.ends);
    }
    return formatClock(event.starts);
  }

  function sheetWhen(event) {
    const datePart = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      weekday: "long",
      month: "short",
      day: "numeric"
    }).format(event.starts);
    if (event.allDay) return datePart + " · All day";
    return datePart + " · " + formatClock(event.starts);
  }

  function dayHeading(event, now) {
    const key = ymd(event.starts);
    const today = ymd(now);
    const tomorrow = addDays(today, 1);
    const datePart = new Intl.DateTimeFormat("en-US", {
      timeZone: tz,
      weekday: "short",
      month: "short",
      day: "numeric"
    }).format(event.starts);
    if (key === today) return "Today · " + datePart;
    if (key === tomorrow) return "Tomorrow · " + datePart;
    return datePart;
  }

  function showText(el, text) {
    el.hidden = !text;
    el.textContent = text || "";
  }

  function openEvent(event, fileBuffer, opener, opts) {
    const keep = !!(opts && opts.keepFocus);
    if (!keep) returnFocus = opener || null;
    openId = event.id || "";
    kickerEl.textContent = kindLabel(event.kind);
    titleEl.textContent = event.title;
    whenEl.textContent = sheetWhen(event);
    showText(whereEl, whereLine(event));
    const leave = resolveLeave(event, fileBuffer);
    if (!leave) {
      leaveEl.hidden = true;
    } else {
      leaveEl.hidden = false;
      leaveEl.classList.toggle("pending", !!leave.pending);
      leaveTimeEl.textContent = leave.pending ? "Not set yet" : formatClock(leave.at);
      showText(leaveMetaEl, leaveMeta(leave));
    }
    showText(detailEl, event.detail);
    if (event.url) {
      mapEl.hidden = false;
      mapEl.href = event.url;
    } else {
      mapEl.hidden = true;
      mapEl.removeAttribute("href");
    }
    reader.hidden = false;
    document.body.classList.add("reader-open");
    if (!keep) backBtn.focus();
  }

  function closeReader() {
    if (reader.hidden) return;
    reader.hidden = true;
    openId = "";
    document.body.classList.remove("reader-open");
    const back = returnFocus;
    returnFocus = null;
    if (back && back.focus) back.focus();
  }

  function renderCalCard(event, fileBuffer) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card next cal-card";
    if (event.id) btn.dataset.id = event.id;
    const rail = document.createElement("div");
    rail.className = "rail";
    rail.setAttribute("aria-hidden", "true");
    const status = document.createElement("div");
    status.className = "status";
    status.textContent = kindLabel(event.kind);
    const title = document.createElement("h3");
    title.textContent = event.title;
    const when = document.createElement("p");
    when.className = "when";
    when.textContent = cardWhen(event);
    btn.appendChild(rail);
    btn.appendChild(status);
    btn.appendChild(title);
    btn.appendChild(when);
    const leave = resolveLeave(event, fileBuffer);
    if (leave) {
      const line = document.createElement("p");
      line.className = "leave-line" + (leave.pending ? " pending" : "");
      line.textContent = leave.pending ? "Leave by not set" : "Leave by " + formatClock(leave.at);
      btn.appendChild(line);
    }
    if (event.detail) {
      const detail = document.createElement("p");
      detail.className = "detail";
      detail.textContent = event.detail;
      btn.appendChild(detail);
    }
    btn.addEventListener("click", function () {
      openEvent(event, fileBuffer, btn);
    });
    return btn;
  }

  function renderCalendar(data) {
    const fileBuffer = finiteNumber(data && data.buffer_minutes);
    setZone(data && data.timezone);
    stampEl.textContent = formatStamp(data && data.updated_at) || "—";
    clear(listEl);
    const raw = data && Array.isArray(data.events) ? data.events : [];
    const now = new Date();
    const events = raw.map(normalizeEvent).filter(Boolean).filter(function (event) {
      return isUpcoming(event, now);
    }).sort(function (a, b) {
      return a.starts.getTime() - b.starts.getTime();
    });
    if (!events.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing upcoming";
      listEl.appendChild(empty);
    } else {
      let group = null;
      events.forEach(function (event) {
        const key = ymd(event.starts);
        if (!group || group.dataset.day !== key) {
          group = document.createElement("section");
          group.className = "day";
          group.dataset.day = key;
          const label = document.createElement("h3");
          label.className = "col-label";
          label.textContent = dayHeading(event, now);
          group.appendChild(label);
          listEl.appendChild(group);
        }
        group.appendChild(renderCalCard(event, fileBuffer));
      });
    }
    if (openId) {
      let match = null;
      events.forEach(function (event) {
        if (event.id && event.id === openId) match = event;
      });
      if (match) openEvent(match, fileBuffer, returnFocus, { keepFocus: true });
      else closeReader();
    }
  }

  function showView(name) {
    const cal = name === "calendar";
    board.hidden = cal;
    calendar.hidden = !cal;
    tabBoard.setAttribute("aria-selected", cal ? "false" : "true");
    tabCalendar.setAttribute("aria-selected", cal ? "true" : "false");
    if (!cal) closeReader();
  }

  function initialView() {
    try {
      const v = new URLSearchParams(location.search).get("view");
      if (v && String(v).toLowerCase() === "calendar") return "calendar";
    } catch (e) {}
    return "board";
  }

  function validCalendar(data) {
    return !!(data && typeof data === "object" && Array.isArray(data.events));
  }

  function applyCalendar(data) {
    if (!validCalendar(data)) return false;
    renderCalendar(data);
    lastGood = data;
    return true;
  }

  function paintUnavailable() {
    clear(listEl);
    stampEl.textContent = "—";
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "—";
    listEl.appendChild(empty);
  }

  async function loadCalendar() {
    if (!pageIsVisible()) return;
    try {
      const res = await fetch("./hub-calendar.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!applyCalendar(data)) {
        if (lastGood) applyCalendar(lastGood);
        else paintUnavailable();
      }
    } catch (e) {
      if (lastGood) applyCalendar(lastGood);
      else paintUnavailable();
    }
  }

  function disarm() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  function arm() {
    disarm();
    if (!pageIsVisible()) return;
    timer = setInterval(function () {
      if (!pageIsVisible()) {
        disarm();
        return;
      }
      loadCalendar();
    }, CAL_REFRESH_MS);
  }

  tabBoard.addEventListener("click", function () { showView("board"); });
  tabCalendar.addEventListener("click", function () { showView("calendar"); });
  backBtn.addEventListener("click", closeReader);
  reader.addEventListener("click", function (ev) {
    if (ev.target === reader) closeReader();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !reader.hidden) {
      ev.preventDefault();
      closeReader();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (pageIsVisible()) {
      loadCalendar();
      arm();
    } else {
      disarm();
    }
  });

  showView(initialView());
  if (pageIsVisible()) {
    loadCalendar();
    arm();
  }
})();
