<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Grid" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <title>Grid · uptime</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/spacewall-192.png" />
  <script src="./nav.js" defer></script>
  <style>
    :root {
      --ink: #e4e8ee;
      --muted: #8a929e;
      --quiet: #4a5160;
      --line: #161b26;
      --row: #0a0c10;
      --ok: #1aff6e;
      --amber: #ffb020;
      --red: #ff3344;
      --unknown: #3a4250;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { min-height: 100dvh; }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding:
        calc(56px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(28px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));
    }
    .hero {
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
      gap: 12px 24px; margin-bottom: 22px;
      padding-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .kicker {
      font-size: 11px; font-weight: 700; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--quiet); margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(32px, 6vw, 44px); font-weight: 600;
      letter-spacing: -0.03em; line-height: 1;
    }
    .meta {
      text-align: right; font-size: 12px; color: var(--muted); line-height: 1.5;
    }
    .meta #refresh { color: var(--quiet); letter-spacing: 0.06em; }
    .legend {
      display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px;
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--quiet);
    }
    .legend span::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px;
      margin-right: 6px; vertical-align: middle;
    }
    .legend .ok::before { background: var(--ok); }
    .legend .deg::before { background: var(--amber); }
    .legend .down::before { background: var(--red); }
    .legend .unk::before { background: var(--unknown); }

    #board { display: flex; flex-direction: column; gap: 8px; }
    .svc {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 88px 1fr;
      gap: 12px 16px;
      align-items: center;
      padding: 14px 16px;
      background: var(--row);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none; color: inherit;
    }
    .svc:hover, .svc:focus-visible { border-color: #2a3344; outline: none; }
    .svc .name {
      font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #e8ecf2;
    }
    .svc .detail {
      grid-column: 1 / -1;
      font-size: 12px; color: var(--muted); line-height: 1.35;
      margin-top: -4px;
    }
    @media (min-width: 640px) {
      .svc .detail { grid-column: auto; grid-row: 2; margin-top: 0; }
      .svc {
        grid-template-columns: minmax(140px, 200px) 100px 1fr;
        grid-template-rows: auto auto;
      }
      .svc .name { grid-row: 1; }
      .svc .badge { grid-row: 1; }
      .svc .bars { grid-row: 1 / span 2; align-self: center; }
      .svc .detail { grid-column: 1 / 3; }
    }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 72px; padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge.ok { color: var(--ok); border-color: rgba(26,255,110,0.25); background: rgba(26,255,110,0.06); }
    .badge.degraded { color: var(--amber); border-color: rgba(255,176,32,0.3); background: rgba(255,176,32,0.07); }
    .badge.major, .badge.critical, .badge.down {
      color: var(--red); border-color: rgba(255,51,68,0.35); background: rgba(255,51,68,0.08);
    }
    .badge.unknown { color: var(--quiet); border-color: #222832; background: #0c0e12; }

    .bars {
      display: flex; gap: 1px; height: 28px; align-items: stretch;
      min-width: 0;
    }
    .bars i {
      flex: 1; min-width: 2px; border-radius: 1px;
      background: var(--unknown);
    }
    .bars i.ok { background: var(--ok); opacity: 0.85; }
    .bars i.degraded { background: var(--amber); }
    .bars i.down, .bars i.major, .bars i.critical { background: var(--red); }
    .bars i.unknown { background: #222832; }

    .foot {
      margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--quiet);
    }
    @media (max-width: 560px) {
      .svc { grid-template-columns: 1fr auto; }
      .svc .bars { grid-column: 1 / -1; height: 22px; }
      .svc .detail { grid-column: 1 / -1; }
      .meta { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <p class="kicker">Uptime</p>
        <h1>Grid</h1>
      </div>
      <div class="meta">
        <div>Public status APIs · live poll</div>
        <div id="refresh">—</div>
      </div>
    </header>
    <div class="legend" aria-hidden="true">
      <span class="ok">Up</span>
      <span class="deg">Degraded</span>
      <span class="down">Down</span>
      <span class="unk">Unknown / blocked</span>
    </div>
    <main id="board" aria-live="polite"></main>
    <p class="foot">Grid · 90-day strip from incidents when the API allows · CORS fallback → unknown</p>
  </div>
  <script>
(function () {
  const REFRESH_MS = 60000;
  const DAYS = 90;

  const SERVICES = [
    { id: "cloudflare", name: "Cloudflare", url: "https://www.cloudflarestatus.com/api/v2/summary.json", href: "https://www.cloudflarestatus.com/", parse: "statuspage" },
    { id: "github", name: "GitHub", url: "https://www.githubstatus.com/api/v2/summary.json", href: "https://www.githubstatus.com/", parse: "statuspage" },
    { id: "gcp", name: "Google Cloud", url: "https://status.cloud.google.com/incidents.json", href: "https://status.cloud.google.com/", parse: "google" },
    { id: "gws", name: "Google Workspace", url: "https://www.google.com/appsstatus/dashboard/incidents.json", href: "https://www.google.com/appsstatus/dashboard/", parse: "google" },
    { id: "aws", name: "AWS", url: "https://health.aws.amazon.com/health/api/v1/public-service-events", href: "https://health.aws.amazon.com/health/status", parse: "aws" },
    { id: "x", name: "X", url: "./x-status.json", href: "https://developer.x.com/status", parse: "xproxy", bust: true },
    { id: "xai", name: "xAI", url: "https://status.x.ai/feed.xml", href: "https://status.x.ai/", parse: "xai", format: "xml" },
    { id: "openai", name: "OpenAI", url: "https://status.openai.com/api/v2/summary.json", href: "https://status.openai.com/", parse: "statuspage" },
    { id: "cursor", name: "Cursor", url: "https://status.cursor.com/api/v2/summary.json", href: "https://status.cursor.com/", parse: "statuspage" },
    { id: "discord", name: "Discord", url: "https://discordstatus.com/api/v2/summary.json", href: "https://discordstatus.com/", parse: "statuspage" },
    { id: "slack", name: "Slack", url: "https://slack-status.com/api/v2.0.0/current", href: "https://slack-status.com/", parse: "slack" }
  ];

  const state = {};
  SERVICES.forEach(function (s) {
    state[s.id] = { level: "unknown", label: "…", detail: "loading", days: null };
  });

  function clip(text, max) {
    max = max || 96;
    var s = String(text || "").replace(/\s+/g, " ").trim();
    if (s.length <= max) return s;
    var cut = s.slice(0, max - 1);
    var sp = cut.lastIndexOf(" ");
    if (sp >= 40) cut = cut.slice(0, sp);
    return cut.replace(/[\s,;:.–—-]+$/, "") + "…";
  }

  function dayKey(d) {
    return d.toISOString().slice(0, 10);
  }

  function emptyDays() {
    var out = [];
    var now = new Date();
    for (var i = DAYS - 1; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400000);
      out.push({ key: dayKey(d), level: "ok" });
    }
    return out;
  }

  function paintIncidents(days, incidents) {
    if (!Array.isArray(incidents)) return days;
    incidents.forEach(function (inc) {
      var st = String(inc.status || "").toLowerCase();
      var impact = String(inc.impact || inc.severity || "").toLowerCase();
      var level = "degraded";
      if (impact === "critical" || impact === "major" || st === "critical") level = "down";
      else if (impact === "none" || impact === "maintenance") level = "degraded";
      var start = Date.parse(inc.created_at || inc.started_at || "");
      var end = Date.parse(inc.resolved_at || inc.updated_at || "") || Date.now();
      if (!start) return;
      days.forEach(function (day) {
        var t0 = Date.parse(day.key + "T00:00:00Z");
        var t1 = t0 + 86400000;
        if (end >= t0 && start < t1) {
          if (day.level === "ok" || (day.level === "degraded" && level === "down")) day.level = level;
        }
      });
    });
    return days;
  }

  function fromStatuspage(data) {
    var ind = (data && data.status && data.status.indicator) || "none";
    var desc = (data && data.status && data.status.description) || "";
    var level = "ok";
    var label = "Up";
    if (ind === "minor") { level = "degraded"; label = "Degraded"; }
    else if (ind === "major") { level = "major"; label = "Major"; }
    else if (ind === "critical") { level = "critical"; label = "Down"; }
    else if (ind !== "none") { level = "degraded"; label = "Degraded"; }
    var open = "";
    var list = (data && data.incidents) || [];
    for (var i = 0; i < list.length; i++) {
      var st = String(list[i].status || "").toLowerCase();
      if (st === "resolved" || st === "postmortem" || st === "completed") continue;
      open = list[i].name || "";
      break;
    }
    var days = paintIncidents(emptyDays(), list);
    if (level === "ok") days[days.length - 1].level = "ok";
    else days[days.length - 1].level = level === "critical" || level === "major" ? "down" : "degraded";
    return {
      level: level,
      label: label,
      detail: clip(open || desc || "All systems operational"),
      days: days
    };
  }

  function fromGoogle(data) {
    var list = Array.isArray(data) ? data : [];
    var open = list.filter(function (x) {
      var s = String((x && (x.status || x.end)) || "").toLowerCase();
      return !x.end && s !== "resolved" && !/Status:\s*RESOLVED/i.test(String(x.external_desc || x.text || ""));
    });
    var level = open.length ? "degraded" : "ok";
    var label = open.length ? "Degraded" : "Up";
    var detail = open.length
      ? clip(open[0].external_desc || open[0].service_name || open[0].text || "Open incident")
      : "No open incidents";
    var days = emptyDays();
    list.forEach(function (inc) {
      var start = Date.parse(inc.begin || inc.created || inc.start || "");
      var end = Date.parse(inc.end || "") || Date.now();
      if (!start) return;
      var sev = String(inc.severity || inc.status_impact || "").toLowerCase();
      var lv = /high|critical|major/.test(sev) ? "down" : "degraded";
      days.forEach(function (day) {
        var t0 = Date.parse(day.key + "T00:00:00Z");
        var t1 = t0 + 86400000;
        if (end >= t0 && start < t1) {
          if (day.level === "ok" || (day.level === "degraded" && lv === "down")) day.level = lv;
        }
      });
    });
    if (level !== "ok") days[days.length - 1].level = "degraded";
    return { level: level, label: label, detail: detail, days: days };
  }

  function fromSlack(data) {
    var st = String((data && data.status) || "").toLowerCase();
    var level = "ok";
    var label = "Up";
    if (st && st !== "ok" && st !== "active" && st !== "none") {
      level = /major|outage|fatal|critical/.test(st) ? "critical" : "degraded";
      label = level === "critical" ? "Down" : "Degraded";
    }
    var detail = clip((data && (data.status_description || data.title)) || (level === "ok" ? "All systems operational" : st));
    var days = emptyDays();
    days[days.length - 1].level = level === "ok" ? "ok" : level === "critical" ? "down" : "degraded";
    return { level: level, label: label, detail: detail, days: days };
  }

  function fromXProxy(data) {
    var st = data && data.status;
    var level = "unknown";
    var label = "Unknown";
    if (st === "ok" || st === "up" || st === "none") { level = "ok"; label = "Up"; }
    else if (st === "degraded" || st === "minor") { level = "degraded"; label = "Degraded"; }
    else if (st === "major" || st === "critical" || st === "down") { level = "critical"; label = "Down"; }
    var detail = clip((data && (data.detail || data.description)) || (level === "ok" ? "Proxy snapshot" : "See developer.x.com/status"));
    var days = emptyDays();
    if (level === "ok") days[days.length - 1].level = "ok";
    else if (level === "unknown") days[days.length - 1].level = "unknown";
    else days[days.length - 1].level = level === "critical" ? "down" : "degraded";
    return { level: level, label: label, detail: detail, days: days };
  }

  function fromXaiRss(text) {
    var days = emptyDays();
    var level = "ok";
    var label = "Up";
    var detail = "No recent incidents in feed";
    try {
      var doc = new DOMParser().parseFromString(text, "text/xml");
      var items = doc.querySelectorAll("item");
      if (items.length) {
        var title = (items[0].querySelector("title") || {}).textContent || "";
        var pub = (items[0].querySelector("pubDate") || {}).textContent || "";
        if (/incident|outage|degraded|down/i.test(title)) {
          level = /outage|down|critical/i.test(title) ? "critical" : "degraded";
          label = level === "critical" ? "Down" : "Degraded";
        }
        detail = clip(title + (pub ? " · " + pub : ""));
        var t = Date.parse(pub);
        if (t) {
          var key = dayKey(new Date(t));
          days.forEach(function (d) {
            if (d.key === key) d.level = level === "ok" ? "ok" : level === "critical" ? "down" : "degraded";
          });
        }
      }
    } catch (e) {}
    days[days.length - 1].level = level === "ok" ? "ok" : level === "critical" ? "down" : "degraded";
    return { level: level, label: label, detail: detail, days: days };
  }

  function fromAws(data) {
    /* Most AWS health endpoints block browser CORS — treat payload if present. */
    var level = "ok";
    var label = "Up";
    var detail = "No open public events";
    var list = Array.isArray(data) ? data : (data && data.events) || [];
    if (list.length) {
      level = "degraded";
      label = "Degraded";
      detail = clip(list[0].title || list[0].arn || "Open AWS health event");
    }
    var days = emptyDays();
    days[days.length - 1].level = level === "ok" ? "ok" : "degraded";
    return { level: level, label: label, detail: detail, days: days };
  }

  function parsePayload(svc, payload) {
    if (svc.parse === "statuspage") return fromStatuspage(payload);
    if (svc.parse === "google") return fromGoogle(payload);
    if (svc.parse === "slack") return fromSlack(payload);
    if (svc.parse === "xproxy") return fromXProxy(payload);
    if (svc.parse === "xai") return fromXaiRss(payload);
    if (svc.parse === "aws") return fromAws(payload);
    return { level: "unknown", label: "Unknown", detail: "No parser", days: emptyDays().map(function (d) { d.level = "unknown"; return d; }) };
  }

  function badgeClass(level) {
    if (level === "ok") return "ok";
    if (level === "degraded") return "degraded";
    if (level === "major" || level === "critical" || level === "down") return "down";
    return "unknown";
  }

  function render() {
    var board = document.getElementById("board");
    var html = "";
    SERVICES.forEach(function (svc) {
      var st = state[svc.id];
      var days = st.days || emptyDays().map(function (d) { d.level = "unknown"; return d; });
      var bars = days.map(function (d) {
        var lv = d.level === "major" || d.level === "critical" ? "down" : d.level;
        return '<i class="' + lv + '" title="' + d.key + '"></i>';
      }).join("");
      var href = svc.href || svc.url || "#";
      html += '<a class="svc" href="' + href + '" target="_blank" rel="noopener">' +
        '<div class="name">' + svc.name + '</div>' +
        '<div class="badge ' + badgeClass(st.level) + '">' + (st.label || "—") + '</div>' +
        '<div class="bars" aria-hidden="true">' + bars + '</div>' +
        '<div class="detail">' + (st.detail || "") + '</div>' +
        "</a>";
    });
    board.innerHTML = html;
  }

  async function pollOne(svc) {
    try {
      var url = svc.url;
      if (svc.bust) url += (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
      var res = await fetch(url, { cache: "no-store", mode: "cors" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var payload = svc.format === "xml" ? await res.text() : await res.json();
      state[svc.id] = parsePayload(svc, payload);
    } catch (e) {
      state[svc.id] = {
        level: "unknown",
        label: "Unknown",
        detail: clip("Blocked or unreachable (" + (e && e.message ? e.message : "fetch") + ") — open status page"),
        days: emptyDays().map(function (d) { d.level = "unknown"; return d; })
      };
      state[svc.id].days[state[svc.id].days.length - 1].level = "unknown";
    }
  }

  async function refresh() {
    await Promise.all(SERVICES.map(pollOne));
    render();
    var el = document.getElementById("refresh");
    if (el) {
      var d = new Date();
      el.textContent = "Updated " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }
  }

  render();
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
  </script>
</body>
</html>
