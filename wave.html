<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="SPACEWALL WAVE" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070708" />
  <meta name="color-scheme" content="dark" />
  <title>SPACEWALL · WAVE</title>
  <script src="./deck.js?h=b98aed2ee2f1" defer></script>
  <style>
    :root {
      --bg: #070708;
      --text: #e8e8ec;
      --muted: #6a6a74;
      --red-fierce: #ff0033;
      --dim: #2c2c32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #orbit {
      height: 100%;
      animation: pixel-orbit 210s ease-in-out infinite alternate;
    }

    #board-frame {
      display: none;
    }

    body.spacewall-mode #board-frame {
      display: block;
      position: fixed;
      inset: 0;
      border: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #070708;
    }

    body.spacewall-mode .room { display: none; }

    body.deeper .glass { background: rgba(7, 7, 9, 0.2); }
    body.deeper .clock { color: #8e8e96; }
    body.deeper #wave.on { filter: brightness(0.82); }

    .room {
      position: relative;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 32px 22px;
    }

    .top, .bottom {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      animation: drift-chrome 64s ease-in-out infinite alternate;
    }

    .bottom { align-items: flex-end; }

    .brand {
      font-weight: 800;
      letter-spacing: 0.22em;
      font-size: 15px;
      color: #f2f2f5;
    }

    .brand span { color: var(--red-fierce); }

    .tag, .hint, .honesty {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .honesty {
      max-width: 52ch;
      letter-spacing: 0.06em;
      text-transform: none;
      line-height: 1.45;
      color: #4a4a52;
    }

    .hint { color: var(--dim); }

    .bottom-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .ver {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #2c2c32;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      animation: drift-stage 80s ease-in-out infinite alternate;
    }

    .clock {
      font-size: clamp(42px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      color: #d8d8de;
    }

    .status {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    a {
      color: #8a8a94;
      text-decoration: none;
    }

    a:hover { color: #c8c8d0; }

    #wave {
      position: fixed;
      inset: 0;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.4s ease;
    }

    #wave.on {
      opacity: 1;
    }

    #wave.out {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #wave:not(.on):not(.out) .blob,
    #wave:not(.on):not(.out) .band,
    #wave:not(.on):not(.out) .swell path {
      animation-play-state: paused;
    }

    .glass {
      position: absolute;
      inset: 0;
      background: rgba(7, 7, 9, 0.06);
      backdrop-filter: blur(7px) saturate(0.88);
      -webkit-backdrop-filter: blur(7px) saturate(0.88);
    }

    .field {
      position: absolute;
      inset: -18%;
      transform: translateZ(0);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      filter: blur(28px);
    }

    .blob.a {
      width: 72vw;
      height: 56vw;
      left: -14vw;
      top: 4vh;
      background: radial-gradient(circle at 40% 40%, rgba(92, 28, 38, 0.42), transparent 68%);
      animation: drift-a 28s ease-in-out infinite alternate;
    }

    .blob.b {
      width: 64vw;
      height: 52vw;
      right: -16vw;
      top: -8vh;
      background: radial-gradient(circle at 50% 50%, rgba(36, 42, 58, 0.4), transparent 70%);
      animation: drift-b 36s ease-in-out infinite alternate;
    }

    .blob.c {
      width: 84vw;
      height: 46vw;
      left: 8vw;
      bottom: -16vh;
      background: radial-gradient(circle at 50% 40%, rgba(24, 20, 24, 0.5), transparent 72%);
      animation: drift-c 24s ease-in-out infinite alternate;
    }

    .blob.d {
      width: 48vw;
      height: 48vw;
      left: 30vw;
      top: 18vh;
      background: radial-gradient(circle at 50% 50%, rgba(64, 26, 34, 0.28), transparent 66%);
      animation: drift-d 32s ease-in-out infinite alternate;
    }

    .swell {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .swell path {
      filter: blur(10px);
    }

    .band {
      position: absolute;
      left: -18%;
      top: 18%;
      width: 136%;
      height: 46%;
      opacity: 0.7;
      filter: blur(22px);
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(68, 22, 32, 0.38) 46%,
        rgba(16, 16, 20, 0.12) 100%
      );
      border-radius: 50%;
      animation: swell-y 18s ease-in-out infinite alternate;
    }

    .band.two {
      top: auto;
      bottom: 0;
      height: 40%;
      opacity: 0.55;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(28, 32, 44, 0.4) 50%,
        transparent 100%
      );
      animation-duration: 24s;
      animation-direction: alternate-reverse;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.28) 100%);
      pointer-events: none;
    }

    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(18vw, 14vh, 0) scale(1.16); }
    }

    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(-20vw, 16vh, 0) rotate(-14deg); }
    }

    @keyframes drift-c {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-14vw, -12vh, 0) scale(1.1); }
    }

    @keyframes drift-d {
      from { transform: translate3d(0, 10vh, 0) scale(0.9); }
      to { transform: translate3d(12vw, -14vh, 0) scale(1.22); }
    }

    @keyframes swell-y {
      from { transform: translate3d(-8vw, 10vh, 0) rotate(-6deg); }
      to { transform: translate3d(10vw, -12vh, 0) rotate(7deg); }
    }

    @keyframes pixel-orbit {
      from { transform: translate3d(-6px, -5px, 0); }
      to { transform: translate3d(7px, 6px, 0); }
    }

    @keyframes drift-chrome {
      from { transform: translate3d(-10px, 0, 0); }
      to { transform: translate3d(14px, 6px, 0); }
    }

    @keyframes drift-stage {
      from { transform: translate3d(8px, -6px, 0); }
      to { transform: translate3d(-12px, 10px, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      /* Motion is the OLED point of this page — keep it, just slower. */
      .blob, .band, .top, .bottom, .stage {
        animation-duration: 90s;
      }
    }
  </style>
</head>
<body>
  <div id="orbit">
  <iframe id="board-frame" title="SPACEWALL" hidden></iframe>
  <div class="room">
    <div class="top">
      <div class="brand">SPACE<span>WALL</span></div>
      <div class="tag">wave portal</div>
    </div>
    <div class="stage">
      <div class="clock" id="clock">—</div>
      <div class="status" id="status" aria-live="polite">idle overlay armed</div>
    </div>
    <div class="bottom">
      <p class="honesty">
        Phase A · browser fullscreen portal. A web page cannot sit on top of Grok Bot.app.
        Phase B is a native always-on-top click-through overlay — not this file.
      </p>
      <div class="bottom-meta">
        <div id="ver" class="ver" data-portal="WAVE">WAVE 26.38.4</div>
        <div class="hint">esc dismisses · ?idle=sec · <a href="./hearth.html">hearth</a> · <a href="./">wall</a></div>
      </div>
    </div>
  </div>

  <div id="wave" aria-hidden="true">
    <div class="glass"></div>
    <div class="field">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
      <div class="blob d"></div>
      <div class="band"></div>
      <div class="band two"></div>
      <svg class="swell" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
        <path fill="rgba(72,20,30,0.42)" d="M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z">
          <animate attributeName="d" dur="22s" repeatCount="indefinite"
            values="
              M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z;
              M0,500 C200,560 360,440 560,500 C760,560 900,620 1080,540 C1240,480 1340,520 1440,500 L1440,900 L0,900 Z;
              M0,540 C160,490 340,580 540,530 C740,480 900,400 1100,460 C1260,506 1340,490 1440,450 L1440,900 L0,900 Z;
              M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z
            " />
        </path>
        <path fill="rgba(28,32,44,0.4)" d="M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z">
          <animate attributeName="d" dur="28s" repeatCount="indefinite"
            values="
              M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z;
              M0,660 C180,700 420,620 640,680 C860,740 1020,640 1200,670 C1320,688 1380,700 1440,680 L1440,900 L0,900 Z;
              M0,620 C240,580 380,720 600,640 C820,560 1000,600 1200,560 C1320,538 1380,580 1440,560 L1440,900 L0,900 Z;
              M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z
            " />
        </path>
      </svg>
    </div>
    <div class="vignette"></div>
  </div>
  </div>

  <script>
(function () {
  const VERSION_CHECK_MS = 3 * 60 * 1000;
  const DEFAULT_IDLE_SEC = 240;
  const DEEP_AFTER_MS = 90 * 1000;

  const params = new URLSearchParams(location.search);
  const wave = document.getElementById("wave");
  const clockEl = document.getElementById("clock");
  const statusEl = document.getElementById("status");
  const frame = document.getElementById("board-frame");

  if (params.get("mode") === "spacewall") {
    document.body.classList.add("spacewall-mode");
    frame.hidden = false;
    frame.src = "./index.html?embed=1";
  }

  function idleSeconds() {
    try {
      const raw = new URLSearchParams(location.search).get("idle");
      if (raw == null || raw === "") return DEFAULT_IDLE_SEC;
      const n = Number(raw);
      if (!Number.isFinite(n) || n < 0) return DEFAULT_IDLE_SEC;
      return Math.min(n, 86400);
    } catch (e) {
      return DEFAULT_IDLE_SEC;
    }
  }

  const idleMs = idleSeconds() * 1000;
  let timer = null;
  let countdown = null;
  let deepTimer = null;
  let showing = false;
  let armed = false;
  let loadedVersion = null;
  let reloadArmed = false;

  function formatClock(d) {
    try {
      return d.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        timeZone: "America/Chicago",
        hour12: true
      }) + " CT";
    } catch (e) {
      return d.toISOString();
    }
  }

  function formatRemain(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ":" + String(r).padStart(2, "0");
  }

  function setStatus(text) {
    if (statusEl.textContent !== text) statusEl.textContent = text;
  }

  function showWave() {
    if (showing) return;
    showing = true;
    wave.classList.remove("out");
    wave.classList.add("on");
    wave.setAttribute("aria-hidden", "false");
    setStatus("wave · move to clear");
    if (deepTimer) clearTimeout(deepTimer);
    deepTimer = setTimeout(function () {
      document.body.classList.add("deeper");
    }, DEEP_AFTER_MS);
  }

  function hideWave() {
    document.body.classList.remove("deeper");
    if (deepTimer) clearTimeout(deepTimer);
    if (!showing) {
      wave.classList.remove("on", "out");
      return;
    }
    showing = false;
    wave.classList.add("out");
    wave.classList.remove("on");
    wave.setAttribute("aria-hidden", "true");
  }

  function armIdle() {
    if (timer) clearTimeout(timer);
    if (countdown) clearInterval(countdown);
    const start = Date.now();
    if (idleMs === 0) {
      showWave();
      setStatus("wave · move to clear");
      return;
    }
    timer = setTimeout(showWave, idleMs);
    function tick() {
      if (showing) return;
      const left = idleMs - (Date.now() - start);
      setStatus("idle · wave in " + formatRemain(left));
    }
    tick();
    countdown = setInterval(tick, 250);
  }

  function onActivity(ev) {
    if (!armed) return;
    if (ev && ev.key === "Escape") {
      ev.preventDefault();
    }
    hideWave();
    armIdle();
  }

  function tickClock() {
    clockEl.textContent = formatClock(new Date());
  }

  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(function (type) {
    window.addEventListener(type, onActivity, { passive: false });
  });

  function versionCheckMs() {
    try {
      const raw = new URLSearchParams(location.search).get("vcheck");
      const n = raw ? Number(raw) : NaN;
      if (Number.isFinite(n) && n >= 1000) return n;
    } catch (e) {}
    return VERSION_CHECK_MS;
  }

  function paintStamp(data) {
    const el = document.getElementById("ver");
    if (!el || !data || !data.label) return;
    const name = el.getAttribute("data-portal") || "WAVE";
    el.textContent = name + " " + data.label;
  }

  async function fetchVersion() {
    const url = "./version.json?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || typeof data.v !== "string" || !data.v) {
      throw new Error("bad version");
    }
    paintStamp(data);
    return data.v;
  }

  async function captureVersion() {
    try {
      loadedVersion = await fetchVersion();
    } catch (e) {
      loadedVersion = null;
    }
  }

  async function checkVersion() {
    if (reloadArmed) return;
    try {
      const remote = await fetchVersion();
      if (loadedVersion == null) {
        loadedVersion = remote;
        return;
      }
      if (remote !== loadedVersion) {
        reloadArmed = true;
        location.reload();
      }
    } catch (e) {}
  }

  tickClock();
  setInterval(tickClock, 1000);
  setTimeout(function () {
    armed = true;
    armIdle();
  }, 400);
  captureVersion();
  setInterval(checkVersion, versionCheckMs());
})();
  </script>
</body>
</html>
