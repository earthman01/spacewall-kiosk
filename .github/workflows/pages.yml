name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits from "Refresh X status" do not retrigger push workflows.
  workflow_run:
    workflows: ["Refresh X status"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # Best-effort: agent PATs and GITHUB_TOKEN both 403 on Pages settings today.
      - name: Switch Pages source to GitHub Actions only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow \
            && echo "Pages build_type set to workflow" \
            || echo "WARN: could not set build_type=workflow"

      - name: Stage stub only (no Hub data)
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          printf '%s\n' 'Moved.' > site/index.html
          echo "stub site contents:"
          find site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
