name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits from "Refresh X status" do not retrigger push workflows.
  workflow_run:
    workflows: ["Refresh X status"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Live Pages is currently legacy-from-main, so watchers poll the committed
      # version.json. Always regenerate into the artifact as well: if/when the
      # source is GitHub Actions, this is the file the wall actually receives.
      - name: Stage site and write version.json
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a index.html wave.html hearth.html .nojekyll x-status.json site/
          python3 scripts/write_version.py --out site/version.json
          python3 scripts/write_version.py --check --out site/version.json
          echo "artifact version.json:"
          cat site/version.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
