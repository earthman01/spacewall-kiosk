name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh X status"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Switch Pages source to GitHub Actions only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow \
            && echo "Pages build_type set to workflow" \
            || echo "WARN: could not set build_type=workflow"

      - name: Stage public SPACEWALL boards (no private hub JSON)
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          # index.html = THE public tile landing (one entry). spacewall.html = ops board.
          # Never overwrite index with spacewall.
          cp -a index.html site/index.html
          cp -a spacewall.html site/spacewall.html
          cp -a welcome-lisa.html rich.html hearth.html wave.html press.html hub.html reel.html \
            portal-home.html 404.html deck.js nav.js x-status.json \
            spacewall.webmanifest hearth.webmanifest icons site/
          # Desk dashboard board (Mark+earthbot work) — not the Spacewall portals mirror
          cp -a hub-board.json site/hub-board.json
          cp -a lisa-projects site/
          touch site/.nojekyll
          echo "public site contents:"
          find site -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
