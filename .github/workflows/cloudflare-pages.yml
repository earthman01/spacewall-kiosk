name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh X status"]
    types: [completed]

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Stage site and write version.json
        run: |
          set -euo pipefail
          # Stamp ROOT first so copied HTML carries matching deck.js ?h= and #ver labels.
          python3 scripts/write_version.py --out version.json
          python3 scripts/write_version.py --check --out version.json
          rm -rf site
          mkdir -p site
          # index.html = THE public tile landing. spacewall.html = ops. hub stays its own page.
          cp -a index.html spacewall.html wave.html hearth.html press.html hub.html reel.html rich.html \
            welcome-lisa.html portal-home.html 404.html deck.js nav.js x-status.json \
            press-feed.json hub-board.json hub-calendar.json hub-media \
            spacewall.webmanifest hearth.webmanifest icons site/
          cp -a lisa-projects site/
          cp version.json site/version.json
          touch site/.nojekyll
          echo "artifact version.json:"
          cat site/version.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=spacewall-kiosk --branch=main
