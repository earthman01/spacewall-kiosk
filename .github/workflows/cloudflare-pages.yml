name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Keep CF Pages in sync when Refresh X status commits (push from GITHUB_TOKEN
  # does not retrigger push workflows).
  workflow_run:
    workflows: ["Refresh X status"]
    types: [completed]

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip failed Refresh X status runs
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Stage site and write version.json
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          # Root index.html is the public github.io stub (Moved.). Real kiosk entry is spacewall.html.
          cp -a spacewall.html wave.html hearth.html press.html hub.html reel.html rich.html deck.js x-status.json \
            press-feed.json hub-board.json hub-calendar.json hub-media spacewall.webmanifest hearth.webmanifest icons site/
          cp site/spacewall.html site/index.html
          rm -f site/spacewall.html
          touch site/.nojekyll
          python3 scripts/write_version.py --out site/version.json
          python3 scripts/write_version.py --check --out site/version.json
          echo "artifact version.json:"
          cat site/version.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=spacewall-kiosk --branch=main
