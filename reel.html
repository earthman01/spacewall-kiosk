<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="REEL" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050608" />
  <meta name="color-scheme" content="dark" />
  <title>REEL</title>
  <script src="./nav.js" defer></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #050608; color: #c8d0dc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    #stage {
      position: fixed; inset: 0;
      background: #050608;
    }
    #player {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      /* slight letterbox crop for OLED kiosk feel */
      transform: scale(1.02);
      transform-origin: center center;
      pointer-events: none;
      background: #000;
    }
    .veil {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.55) 0%, transparent 18%, transparent 82%, rgba(0,0,0,.65) 100%),
        radial-gradient(120% 80% at 50% 50%, transparent 40%, rgba(0,0,0,.35) 100%);
    }
    .hud {
      position: fixed; left: 18px; right: 18px; bottom: 22px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      z-index: 5; pointer-events: none;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .meta { pointer-events: none; max-width: min(52vw, 420px); }
    .kicker {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: #6a7484; font-weight: 600; margin: 0 0 6px;
    }
    .title {
      margin: 0; font-size: clamp(18px, 2.4vw, 28px); font-weight: 600;
      letter-spacing: .04em; color: #e4eaf2; text-shadow: 0 2px 18px rgba(0,0,0,.7);
    }
    .sub {
      margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: #8a94a4;
      text-shadow: 0 1px 10px rgba(0,0,0,.6);
    }
    #unmute {
      pointer-events: auto;
      appearance: none; border: 1px solid rgba(180,190,210,.28);
      background: rgba(12,14,18,.72); color: #e8eef8;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 999px; padding: 12px 20px;
      font-size: 12px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 8px 28px rgba(0,0,0,.45);
    }
    #unmute:hover, #unmute:focus-visible {
      border-color: rgba(210,220,240,.55); outline: none; color: #fff;
    }
    #unmute[data-on="1"] {
      border-color: rgba(120,200,140,.45); color: #d8f5e0;
    }
    .stamp {
      position: fixed; top: 52px; right: 18px; z-index: 5;
      font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
      color: #4a5260; pointer-events: none;
    }
    .fallback {
      display: none; position: absolute; inset: 0;
      place-items: center; text-align: center; padding: 40px;
      color: #8a94a4; font-size: 14px; line-height: 1.5;
    }
    body.no-embed .fallback { display: grid; }
    body.no-embed #player { display: none; }
  </style>
</head>
<body>
  <div id="stage" aria-label="Live video">
    <!-- NASA Live (Earth from space / mission control). Autoplay muted + playsinline for kiosk/TV. -->
    <iframe
      id="player"
      title="NASA Live"
      src="https://www.youtube-nocookie.com/embed/21X5lGlDOfg?autoplay=1&mute=1&playsinline=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      playsinline
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <div class="veil" aria-hidden="true"></div>
    <div class="fallback">
      Live video could not load. Open this page on a network that allows YouTube embeds,
      or tap Unmute after the player appears.
    </div>
  </div>

  <div class="stamp" id="ver" data-portal="REEL">REEL · live</div>

  <div class="hud">
    <div class="meta">
      <p class="kicker">Always rolling</p>
      <h1 class="title">NASA Live</h1>
      <p class="sub">Earth / ISS / mission feeds — muted by default for the OLED. Tap Unmute when you want sound.</p>
    </div>
    <button type="button" id="unmute" aria-pressed="false" data-on="0">Unmute</button>
  </div>

  <script>
  (function () {
    var VIDEO_ID = "21X5lGlDOfg";
    var muted = true;
    var btn = document.getElementById("unmute");
    var iframe = document.getElementById("player");

    function embedSrc(mute) {
      var q = [
        "autoplay=1",
        "mute=" + (mute ? "1" : "0"),
        "playsinline=1",
        "controls=0",
        "rel=0",
        "modestbranding=1",
        "iv_load_policy=3",
        "enablejsapi=1"
      ].join("&");
      return "https://www.youtube-nocookie.com/embed/" + VIDEO_ID + "?" + q;
    }

    function setMuted(next) {
      muted = !!next;
      iframe.src = embedSrc(muted);
      btn.setAttribute("aria-pressed", muted ? "false" : "true");
      btn.dataset.on = muted ? "0" : "1";
      btn.textContent = muted ? "Unmute" : "Mute";
    }

    btn.addEventListener("click", function () {
      setMuted(!muted);
    });

    /* Soft retry if iframe never fires load (blocked) */
    var loaded = false;
    iframe.addEventListener("load", function () { loaded = true; });
    setTimeout(function () {
      if (!loaded) document.body.classList.add("no-embed");
    }, 12000);

    /* version stamp */
    fetch("./version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var el = document.getElementById("ver");
        if (el && d && d.label) el.textContent = "REEL " + d.label;
      })
      .catch(function () {});
  })();
  </script>
</body>
</html>
