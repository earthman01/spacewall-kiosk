      <div class="card" style="left:-2%;top:62%;width:34%;height:36%;z-index:1;opacity:0.84">
        <div class="art face-twilight-4"></div>
        <div class="glass"></div>
      </div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <svg class="grain" aria-hidden="true">
      <filter id="reel-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      </filter>
      <rect width="100%" height="100%" filter="url(#reel-grain)"></rect>
    </svg>
    <div id="pack-label" class="pack" aria-live="polite">Twilight</div>
    <div class="hint">
      <a href="./hub.html">hub</a>
      ·
      <a href="./hearth.html">hearth</a>
      ·
      <a href="./">spacewall</a>
    </div>
    <div id="ver" class="ver" data-portal="REEL">REEL 26.39.2</div>
  </div>
  <div id="hud" hidden></div>

  <script>
(function () {
  const VERSION_CHECK_MS = 3 * 60 * 1000;
  const RESTACK_MS = 14000;

  const PACKS = [
    {
      id: "twilight",
      label: "Twilight",
      aliases: ["twilight", "shoegaze", "dusk"],
      amp: 48,
      slots: [
        { x: -6, y: 4, w: 46, h: 64, z: 2, r: -1.6, s: 1, o: 0.92 },
        { x: 54, y: -8, w: 44, h: 52, z: 3, r: 1.3, s: 1, o: 0.9 },
        { x: 20, y: 26, w: 52, h: 58, z: 6, r: -0.4, s: 1.02, o: 1 },
        { x: 66, y: 44, w: 38, h: 46, z: 4, r: 1.8, s: 0.98, o: 0.88 },
        { x: -2, y: 62, w: 34, h: 36, z: 1, r: 0.6, s: 0.97, o: 0.84 }
      ]
    },
    {
      id: "noir",
      label: "Tech Noir",
      aliases: ["noir", "tech", "technoir", "tech-noir", "chrome"],
      amp: 36,
      slots: [
        { x: -8, y: 8, w: 40, h: 72, z: 3, r: -1.2, s: 1, o: 0.94 },
        { x: 50, y: -6, w: 46, h: 48, z: 2, r: 0.8, s: 1, o: 0.9 },
        { x: 22, y: 28, w: 48, h: 52, z: 6, r: -0.3, s: 1.03, o: 1 },
        { x: 62, y: 40, w: 40, h: 54, z: 4, r: 1.4, s: 1, o: 0.9 },
        { x: 4, y: 58, w: 36, h: 40, z: 1, r: 0.5, s: 0.98, o: 0.86 }
      ]
    },
    {
      id: "void",
      label: "2001",
      aliases: ["void", "2001", "monolith", "orbit"],
      amp: 18,
      slots: [
        { x: 8, y: -12, w: 18, h: 96, z: 3, r: -0.4, s: 1, o: 0.96 },
        { x: 36, y: -8, w: 22, h: 116, z: 6, r: 0.15, s: 1, o: 1 },
        { x: 68, y: -16, w: 16, h: 104, z: 4, r: 0.45, s: 1, o: 0.94 },
        { x: 24, y: 6, w: 11, h: 74, z: 2, r: -0.2, s: 1, o: 0.8 },
        { x: 56, y: 16, w: 9, h: 60, z: 1, r: 0.25, s: 1, o: 0.72 }
      ]
    },
    {
      id: "ember",
      label: "Ember",
      aliases: ["ember", "lotr", "forest", "gold"],
      amp: 42,
      slots: [
        { x: -8, y: 6, w: 52, h: 58, z: 2, r: -1.2, s: 1, o: 0.92 },
        { x: 50, y: -4, w: 48, h: 50, z: 3, r: 1.0, s: 1, o: 0.9 },
        { x: 16, y: 28, w: 56, h: 54, z: 6, r: -0.3, s: 1.02, o: 1 },
        { x: 62, y: 46, w: 42, h: 44, z: 4, r: 1.5, s: 0.98, o: 0.88 },
        { x: -4, y: 60, w: 40, h: 38, z: 1, r: 0.4, s: 0.96, o: 0.84 }
      ]
    }
  ];

  const params = new URLSearchParams(location.search);
  const labelEl = document.getElementById("pack-label");
  const hudEl = document.getElementById("hud");
  const cardEls = Array.prototype.slice.call(document.querySelectorAll("#float .card"));

  let packIndex = 0;
  let lead = 2;
  let seq = 0;
  let raf = 0;
  let looping = false;
  let packTimer = null;
  let stackTimer = null;
  let loadedVersion = null;
  let reloadArmed = false;
  let motionOff = document.documentElement.classList.contains("motion-off");

  const cards = cardEls.map(function (el, i) {
    return {
      el: el,
      art: el.querySelector(".art"),
      home: PACKS[0].slots[i],
      phase: i * 1.7,
      scale: PACKS[0].slots[i].s
    };
  });

  function raw(name) {
    const v = params.get(name);
    return v == null ? null : String(v).toLowerCase();
  }

  function isOff(name) {
    const v = raw(name);
    return v === "0" || v === "off" || v === "false" || v === "no";
  }

  function isOn(name) {
    const v = raw(name);
    return v === "1" || v === "on" || v === "true" || v === "yes";
  }

  function packDurSec() {
    const n = Number(params.get("packdur"));
    if (Number.isFinite(n) && n >= 4 && n <= 3600) return n;
    return 180;
  }

  const packDur = packDurSec();
  const packsOff = isOff("packs");

  function findPack(name) {
    if (!name) return 0;
    const i = PACKS.findIndex(function (p) {
      return p.aliases.indexOf(name) !== -1;
    });
    return i >= 0 ? i : 0;
  }

  packIndex = findPack(raw("pack"));

  function pageIsVisible() {
    return document.visibilityState === "visible";
  }

  function applyDepth() {
    cards.forEach(function (card, i) {
      const front = i === lead;
      card.el.style.zIndex = String(card.home.z + (front ? 8 : 0));
      if (!card.el.classList.contains("swap")) {
        card.el.style.opacity = String(front ? 1 : card.home.o);
      }
    });
  }

  function paint(now) {
    const t = now || performance.now();
    const amp = motionOff ? 0 : PACKS[packIndex].amp;
    cards.forEach(function (card, i) {
      const home = card.home;
      const ph = card.phase;
      const wx = Math.sin(t * 0.00028 + ph) * amp;
      const wy = Math.cos(t * 0.00019 + ph * 1.4) * amp * 0.62;
      const rot = home.r + (motionOff ? 0 : Math.sin(t * 0.00012 + ph) * 0.85);
      const target = home.s * (i === lead ? 1.045 : 1);
      card.scale += (target - card.scale) * (motionOff ? 1 : 0.045);
      const breathe = motionOff ? 1 : 1 + Math.sin(t * 0.00009 + ph) * 0.02;
      card.el.style.transform =
        "translate3d(" + wx.toFixed(2) + "px," + wy.toFixed(2) + "px,0) rotate(" +
        rot.toFixed(3) + "deg) scale(" + (card.scale * breathe).toFixed(4) + ")";
    });
  }

  function applyPack(index, animate) {
    const pack = PACKS[index];
    const token = ++seq;
    document.body.dataset.pack = pack.id;
    labelEl.textContent = pack.label;
    cards.forEach(function (card, i) {
      card.home = pack.slots[i];
      card.el.style.left = card.home.x + "%";
      card.el.style.top = card.home.y + "%";
      card.el.style.width = card.home.w + "%";
      card.el.style.height = card.home.h + "%";
    });
    lead = 2;
    const paintFaces = function () {
      if (token !== seq) return;
      cards.forEach(function (card, i) {
        card.art.className = "art face-" + pack.id + "-" + (i % 5);
        card.el.classList.remove("swap");
      });
      applyDepth();
    };
    if (!animate || motionOff) paintFaces();
    else {
      cards.forEach(function (card) { card.el.classList.add("swap"); });
      window.setTimeout(paintFaces, 520);
    }
    paintHud();
    if (motionOff) paint(performance.now());
  }

  function advance(dir) {
    packIndex = (packIndex + dir + PACKS.length) % PACKS.length;
    applyPack(packIndex, true);
  }

  function restack() {
    if (motionOff) return;
    lead = (lead + 1) % cards.length;
    applyDepth();
  }

  function paintHud() {
    if (!hudEl || hudEl.hidden) return;
    const base =
      "pack:" + PACKS[packIndex].id +
      "  ·  motion:" + (motionOff ? "off" : "on") +
      "  ·  packs:" + (packsOff ? "off" : packDur + "s");
    const prev = hudEl.textContent || "";
    const swipe = prev.match(/swipe:\S+/);
    hudEl.textContent = swipe ? base + "  ·  " + swipe[0] : base;
  }

  function stopLoop() {
    looping = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  function tick(now) {
    if (!looping) return;
    paint(now);
    raf = requestAnimationFrame(tick);
  }

  function startLoop() {
    if (motionOff || looping || !pageIsVisible()) return;
    looping = true;
    raf = requestAnimationFrame(tick);
  }

  function disarmTimers() {
    if (packTimer) clearInterval(packTimer);
    if (stackTimer) clearInterval(stackTimer);
    packTimer = null;
    stackTimer = null;
  }

  function armTimers() {
    disarmTimers();
    if (!pageIsVisible()) return;
    if (!packsOff) {
      packTimer = setInterval(function () { advance(1); }, packDur * 1000);
    }
    if (!motionOff) stackTimer = setInterval(restack, RESTACK_MS);
  }

  function syncMotion(off) {
    motionOff = off;
    document.documentElement.classList.toggle("motion-off", off);
    if (off) {
      stopLoop();
      paint(performance.now());
    } else if (pageIsVisible()) {
      startLoop();
    }
    armTimers();
    paintHud();
  }

  if (isOn("hud")) {
    hudEl.hidden = false;
    paintHud();
  }

  applyPack(packIndex, false);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      document.documentElement.classList.remove("booting");
    });
  });
  armTimers();
  startLoop();

  try {
    const reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    reduceMq.addEventListener("change", function () {
      if (reduceMq.matches) syncMotion(true);
      else if (!isOff("motion")) syncMotion(false);
    });
  } catch (e) {}

  document.addEventListener("visibilitychange", function () {
    if (pageIsVisible()) {
      armTimers();
      startLoop();
    } else {
      disarmTimers();
      stopLoop();
    }
  });

  let startX = 0;
  let startY = 0;
  let tracking = false;

  window.addEventListener("pointerdown", function (ev) {
    if (ev.isPrimary === false) return;
    if (ev.target && ev.target.closest && ev.target.closest("a, button")) return;
    startX = ev.clientX;
    startY = ev.clientY;
    tracking = true;
  }, { passive: true });

  window.addEventListener("pointerup", function (ev) {
    if (!tracking) return;
    tracking = false;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) {
      advance(1);
      return;
    }
    if (Math.abs(dy) < 48 || Math.abs(dy) < Math.abs(dx) * 1.15) return;
    advance(dy < 0 ? 1 : -1);
  }, { passive: true });

  window.addEventListener("pointercancel", function () { tracking = false; });

  window.addEventListener("keydown", function (ev) {
    if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.target && ev.target.closest && ev.target.closest("a, button, input, textarea")) return;
    if (ev.key === "ArrowUp" || ev.key === "PageDown") {
      ev.preventDefault();
      advance(1);
    } else if (ev.key === "ArrowDown" || ev.key === "PageUp") {
      ev.preventDefault();
      advance(-1);
    }
  });

  function versionCheckMs() {
    try {
      const n = Number(params.get("vcheck"));
      if (Number.isFinite(n) && n >= 1000) return n;
    } catch (e) {}
    return VERSION_CHECK_MS;
  }

  function paintStamp(data) {
    const el = document.getElementById("ver");
    if (!el || !data || !data.label) return;
    const name = el.getAttribute("data-portal") || "REEL";
    el.textContent = name + " " + data.label;
  }

  async function fetchVersion() {
    const url = "./version.json?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || typeof data.v !== "string" || !data.v) {
      throw new Error("bad version");
    }
    paintStamp(data);
    return data.v;
  }

  async function captureVersion() {
    try {
      loadedVersion = await fetchVersion();
    } catch (e) {
      loadedVersion = null;
    }
  }

  async function checkVersion() {
    if (reloadArmed) return;
    try {
      const remote = await fetchVersion();
      if (loadedVersion == null) {
        loadedVersion = remote;
        return;
      }
      if (remote !== loadedVersion) {
        reloadArmed = true;
        location.reload();
      }
    } catch (e) {}
  }

  captureVersion();
  setInterval(checkVersion, versionCheckMs());
})();
  </script>
</body>
