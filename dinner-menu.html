<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="refresh" content="300" />
  <title>Dinner menu · Dothan</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
    }
    img#menu {
      display: block; width: 100vw; height: 100vh;
      object-fit: contain; object-position: center;
      background: #000;
      -webkit-user-select: none; user-select: none; pointer-events: none;
      opacity: 1; transition: opacity 280ms ease;
    }
    img#menu.fade { opacity: 0; }
  </style>
</head>
<body>
  <img id="menu" src="./menu-1030.png?v=wine-in-cards" alt="Dothan dinner menu — Friday Oct 30" width="3300" height="2550" />
  <script>
(function () {
  var img = document.getElementById('menu');
  var MENU = './menu-1030.png';
  var VERSION = './version.json';
  var NTFY = 'https://ntfy.sh/sw-dinner-9078675918a9d356afae42e2731a4858/sse';
  var FALLBACK_MS = 5 * 60 * 1000;
  var lastV = null;
  var busy = false;

  function bust(token) {
    return MENU + '?v=' + encodeURIComponent(token);
  }

  function swapTo(token) {
    if (busy) return;
    busy = true;
    var next = new Image();
    next.onload = function () {
      img.classList.add('fade');
      setTimeout(function () {
        img.src = bust(token);
        img.classList.remove('fade');
        busy = false;
      }, 300);
    };
    next.onerror = function () { busy = false; };
    next.src = bust(token);
  }

  function refreshFromVersion() {
    return fetch(VERSION + '?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) { swapTo(String(Date.now())); return; }
        var v = String(j.v || j.label || j.updated_at || Date.now());
        if (lastV === null) { lastV = v; return; }
        if (v !== lastV) { lastV = v; swapTo(v); }
        else { swapTo(v + '-' + Date.now()); }
      })
      .catch(function () { swapTo(String(Date.now())); });
  }

  function onPush() {
    refreshFromVersion();
  }

  function connectNtfy() {
    var es;
    try { es = new EventSource(NTFY); } catch (e) { return; }
    es.onmessage = function (ev) {
      try {
        var data = JSON.parse(ev.data);
        if (data && (data.message === 'reload' || data.message === 'menu' ||
            (typeof data.message === 'string' && data.message.indexOf('reload') >= 0))) {
          onPush();
        }
      } catch (_) {
        if (ev.data && String(ev.data).indexOf('reload') >= 0) onPush();
      }
    };
    es.onerror = function () {};
  }

  fetch(VERSION + '?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (j) lastV = String(j.v || j.label || j.updated_at || '');
    })
    .catch(function () {})
    .then(function () {
      connectNtfy();
      setInterval(function () { refreshFromVersion(); }, FALLBACK_MS);
    });
})();
  </script>
</body>
</html>
