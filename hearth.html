<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="HEARTH" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070708" />
  <meta name="color-scheme" content="dark" />
  <title>HEARTH</title>
  <style>
    :root {
      --bg: #08080a;
      --text: #c8c8ce;
      --muted: #5a5a62;
      --ember: #6a2430;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100dvh;
    }

    #orbit {
      position: relative;
      height: 100dvh;
      animation: pixel-orbit 220s ease-in-out infinite alternate;
    }

    .mural {
      position: absolute;
      inset: -16%;
      pointer-events: none;
      transition: opacity 4s ease;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(36px);
      will-change: transform;
    }

    .blob.a {
      width: 80vw;
      height: 58vw;
      left: -18vw;
      top: 6vh;
      background: radial-gradient(circle at 40% 40%, rgba(78, 24, 34, 0.38), transparent 70%);
      animation: drift-a 32s ease-in-out infinite alternate;
    }

    .blob.b {
      width: 70vw;
      height: 54vw;
      right: -20vw;
      top: -8vh;
      background: radial-gradient(circle at 50% 50%, rgba(28, 34, 48, 0.36), transparent 70%);
      animation: drift-b 40s ease-in-out infinite alternate;
    }

    .blob.c {
      width: 92vw;
      height: 48vw;
      left: 6vw;
      bottom: -20vh;
      background: radial-gradient(circle at 50% 40%, rgba(16, 14, 16, 0.55), transparent 72%);
      animation: drift-c 26s ease-in-out infinite alternate;
    }

    .band {
      position: absolute;
      left: -16%;
      top: 22%;
      width: 132%;
      height: 44%;
      border-radius: 50%;
      filter: blur(26px);
      opacity: 0.65;
      background: linear-gradient(180deg, transparent, rgba(58, 18, 26, 0.34) 48%, transparent);
      animation: swell 20s ease-in-out infinite alternate;
    }

    .band.two {
      top: auto;
      bottom: 2%;
      height: 38%;
      opacity: 0.5;
      background: linear-gradient(180deg, transparent, rgba(24, 28, 40, 0.36) 50%, transparent);
      animation-duration: 27s;
      animation-direction: alternate-reverse;
    }

    .swell {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .swell path { filter: blur(12px); }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(115% 88% at 50% 48%, transparent 46%, rgba(0, 0, 0, 0.42) 100%);
    }

    .room {
      position: relative;
      z-index: 2;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 34px 24px;
    }

    .top, .bottom {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 28px;
    }

    .bottom { align-items: flex-end; }

    .brand {
      font-weight: 800;
      letter-spacing: 0.34em;
      font-size: 13px;
      color: #b8b8be;
    }

    .brand span { color: #8a3038; }

    .tag, .hint, .note {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #3e3e46;
    }

    .note {
      max-width: 46ch;
      letter-spacing: 0.05em;
      text-transform: none;
      line-height: 1.45;
      color: #3a3a42;
    }

    a {
      color: #6a6a74;
      text-decoration: none;
    }

    a:hover { color: #b0b0b8; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial {
      position: relative;
      width: min(58vw, 560px);
      height: min(58vw, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.7;
    }

    .ring .track {
      fill: none;
      stroke: #1a1a20;
      stroke-width: 1.2;
    }

    .ring .prog {
      fill: none;
      stroke: #5a2832;
      stroke-width: 1.6;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
    }

    .clock {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: clamp(56px, 8.5vw, 108px);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 0.92;
      font-variant-numeric: tabular-nums;
      color: #c2c2c8;
    }

    .clock .period {
      font-size: 0.22em;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: #7a7a82;
    }

    .date {
      position: relative;
      font-size: clamp(11px, 1.3vw, 15px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .beat {
      position: relative;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3c3c44;
      font-variant-numeric: tabular-nums;
    }

    body.deeper .mural { opacity: 0.62; }
    body.deeper .clock { color: #8a8a92; }
    body.deeper .date { color: #4a4a52; }
    body.deeper .ring { opacity: 0.45; }

    @keyframes pixel-orbit {
      from { transform: translate3d(-6px, -5px, 0); }
      to { transform: translate3d(7px, 6px, 0); }
    }

    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(16vw, 12vh, 0) scale(1.12); }
    }

    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(-18vw, 14vh, 0) rotate(-12deg); }
    }

    @keyframes drift-c {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-12vw, -10vh, 0) scale(1.08); }
    }

    @keyframes swell {
      from { transform: translate3d(-8vw, 8vh, 0) rotate(-5deg); }
      to { transform: translate3d(9vw, -10vh, 0) rotate(6deg); }
    }
  </style>
</head>
<body>
  <div id="orbit">
    <div class="mural" aria-hidden="true">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
      <div class="band"></div>
      <div class="band two"></div>
      <svg class="swell" viewBox="0 0 1440 900" preserveAspectRatio="none">
        <path fill="rgba(64,20,28,0.34)" d="M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z">
          <animate attributeName="d" dur="24s" repeatCount="indefinite"
            values="
              M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z;
              M0,500 C200,560 360,440 560,500 C760,560 900,620 1080,540 C1240,480 1340,520 1440,500 L1440,900 L0,900 Z;
              M0,540 C160,490 340,580 540,530 C740,480 900,400 1100,460 C1260,506 1340,490 1440,450 L1440,900 L0,900 Z;
              M0,520 C180,470 320,610 520,560 C720,510 860,430 1040,480 C1200,522 1320,500 1440,470 L1440,900 L0,900 Z
            " />
        </path>
        <path fill="rgba(22,24,34,0.36)" d="M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z">
          <animate attributeName="d" dur="30s" repeatCount="indefinite"
            values="
              M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z;
              M0,660 C180,700 420,620 640,680 C860,740 1020,640 1200,670 C1320,688 1380,700 1440,680 L1440,900 L0,900 Z;
              M0,620 C240,580 380,720 600,640 C820,560 1000,600 1200,560 C1320,538 1380,580 1440,560 L1440,900 L0,900 Z;
              M0,640 C220,600 400,700 620,660 C840,620 980,560 1180,600 C1300,624 1380,610 1440,590 L1440,900 L0,900 Z
            " />
        </path>
      </svg>
      <div class="vignette"></div>
    </div>

    <div class="room">
      <div class="top">
        <div class="brand">HEAR<span>TH</span></div>
        <div class="tag">the wall is awake</div>
      </div>
      <div class="stage">
        <div class="dial">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="54"></circle>
            <circle class="prog" id="dayarc" cx="60" cy="60" r="54"
              stroke-dasharray="339.292" stroke-dashoffset="339.292"></circle>
          </svg>
          <div class="clock" id="clock"><span id="hms">—</span><span class="period" id="ampm"></span></div>
          <div class="date" id="date"></div>
          <div class="beat" id="beat"></div>
        </div>
      </div>
      <div class="bottom">
        <p class="note">
          Room portal for the 55&quot; OLED — not another ops grid.
          Browser cannot overlay Grok Bot.app. Fullscreen this page on the panel.
        </p>
        <div class="hint">
          <a href="./">spacewall</a>
          ·
          <a href="./wave.html">wave lab</a>
        </div>
      </div>
    </div>
  </div>

  <script>
(function () {
  const VERSION_CHECK_MS = 3 * 60 * 1000;
  const DEEP_IDLE_MS = 8 * 60 * 1000;
  const RING = 2 * Math.PI * 54;

  const hmsEl = document.getElementById("hms");
  const ampmEl = document.getElementById("ampm");
  const dateEl = document.getElementById("date");
  const beatEl = document.getElementById("beat");
  const arcEl = document.getElementById("dayarc");

  let loadedVersion = null;
  let reloadArmed = false;
  let deepTimer = null;

  function chicagoParts(d) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      weekday: "long",
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true,
      hourCycle: "h12"
    });
    const map = {};
    fmt.formatToParts(d).forEach(function (p) {
      if (p.type !== "literal") map[p.type] = p.value;
    });
    return map;
  }

  function dayFraction(d) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      hour: "numeric",
      minute: "numeric",
      second: "numeric",
      hourCycle: "h23"
    });
    const map = {};
    fmt.formatToParts(d).forEach(function (p) {
      if (p.type !== "literal") map[p.type] = Number(p.value);
    });
    const sec = (map.hour || 0) * 3600 + (map.minute || 0) * 60 + (map.second || 0);
    return sec / 86400;
  }

  function paint() {
    const d = new Date();
    const p = chicagoParts(d);
    const day = (p.dayPeriod || "").toUpperCase();
    hmsEl.textContent = (p.hour || "—") + ":" + (p.minute || "00") + ":" + (p.second || "00");
    ampmEl.textContent = day || "";
    dateEl.textContent = ((p.weekday || "") + "  ·  " + (p.month || "") + " " + (p.day || "")).toUpperCase();
    const frac = dayFraction(d);
    arcEl.style.strokeDashoffset = String(RING * (1 - frac));
    beatEl.textContent = "day  ·  " + Math.round(frac * 100) + "%";
  }

  function armDeep() {
    if (deepTimer) clearTimeout(deepTimer);
    document.body.classList.remove("deeper");
    deepTimer = setTimeout(function () {
      document.body.classList.add("deeper");
    }, DEEP_IDLE_MS);
  }

  function onActivity() {
    armDeep();
  }

  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(function (type) {
    window.addEventListener(type, onActivity, { passive: true });
  });

  function versionCheckMs() {
    try {
      const raw = new URLSearchParams(location.search).get("vcheck");
      const n = raw ? Number(raw) : NaN;
      if (Number.isFinite(n) && n >= 1000) return n;
    } catch (e) {}
    return VERSION_CHECK_MS;
  }

  async function fetchVersion() {
    const url = "./version.json?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || typeof data.v !== "string" || !data.v) throw new Error("bad version");
    return data.v;
  }

  async function captureVersion() {
    try { loadedVersion = await fetchVersion(); } catch (e) { loadedVersion = null; }
  }

  async function checkVersion() {
    if (reloadArmed) return;
    try {
      const remote = await fetchVersion();
      if (loadedVersion == null) { loadedVersion = remote; return; }
      if (remote !== loadedVersion) {
        reloadArmed = true;
        location.reload();
      }
    } catch (e) {}
  }

  paint();
  setInterval(paint, 1000);
  armDeep();
  captureVersion();
  setInterval(checkVersion, versionCheckMs());
})();
  </script>
</body>
</html>
