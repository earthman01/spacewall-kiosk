<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="HEARTH" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#16161c" />
  <meta name="color-scheme" content="dark" />
  <title>HEARTH</title>
  <link rel="manifest" href="./hearth.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/hearth-192.png" />
  <link rel="apple-touch-icon" href="./icons/hearth-192.png" />
  <script src="./deck.js?h=b98aed2ee2f1" defer></script>
  <style>
    /* Palette tokens interpolate on slide change (Chrome / the TV Mac). */
    @property --bg { syntax: "<color>"; inherits: true; initial-value: #16161c; }
    @property --floor-top { syntax: "<color>"; inherits: true; initial-value: #1c1c24; }
    @property --floor-mid { syntax: "<color>"; inherits: true; initial-value: #24222c; }
    @property --floor-bot { syntax: "<color>"; inherits: true; initial-value: #18181e; }
    @property --ember { syntax: "<color>"; inherits: true; initial-value: rgba(112, 40, 52, 0.56); }
    @property --slate { syntax: "<color>"; inherits: true; initial-value: rgba(42, 50, 68, 0.50); }
    @property --ash { syntax: "<color>"; inherits: true; initial-value: rgba(40, 34, 40, 0.44); }
    @property --haze-a { syntax: "<color>"; inherits: true; initial-value: rgba(86, 32, 42, 0.30); }
    @property --haze-b { syntax: "<color>"; inherits: true; initial-value: rgba(36, 44, 62, 0.26); }
    @property --band-warm { syntax: "<color>"; inherits: true; initial-value: rgba(90, 30, 40, 0.42); }
    @property --band-cool { syntax: "<color>"; inherits: true; initial-value: rgba(34, 40, 56, 0.38); }
    @property --swell-warm { syntax: "<color>"; inherits: true; initial-value: rgba(98, 34, 44, 0.40); }
    @property --swell-cool { syntax: "<color>"; inherits: true; initial-value: rgba(30, 34, 48, 0.38); }
    @property --accent { syntax: "<color>"; inherits: true; initial-value: #8e3a42; }
    @property --ring { syntax: "<color>"; inherits: true; initial-value: #6e3840; }
    @property --apl { syntax: "<number>"; inherits: true; initial-value: 1; }

    :root {
      --bg: #16161c;
      --text: #c8ccd4;
      --muted: #6e7280;
      --clock: #d0d4dc;
      --orbit-nudge: 7px;
    }

    /* Hard charcoal under the interpolating body so a wedged --bg cannot flash void. */
    html { background: #18181e; }

    /* --- slides (Apple TV album pattern; ?slides=0 freezes) ---
       All three stay in the same charcoal-room APL band. Wine is burgundy
       charcoal, not a near-black void — dark reds read as OFF on OLED. */
    body[data-slide="ember"] {
      --bg: #16161c;
      --floor-top: #1c1c24;
      --floor-mid: #24222c;
      --floor-bot: #18181e;
      --ember: rgba(112, 40, 52, 0.56);
      --slate: rgba(42, 50, 68, 0.50);
      --ash: rgba(40, 34, 40, 0.44);
      --haze-a: rgba(86, 32, 42, 0.30);
      --haze-b: rgba(36, 44, 62, 0.26);
      --band-warm: rgba(90, 30, 40, 0.42);
      --band-cool: rgba(34, 40, 56, 0.38);
      --swell-warm: rgba(98, 34, 44, 0.40);
      --swell-cool: rgba(30, 34, 48, 0.38);
      --accent: #8e3a42;
      --ring: #6e3840;
    }

    body[data-slide="slate"] {
      --bg: #161a22;
      --floor-top: #1c222c;
      --floor-mid: #222a34;
      --floor-bot: #141820;
      --ember: rgba(46, 60, 84, 0.54);
      --slate: rgba(32, 42, 60, 0.50);
      --ash: rgba(32, 38, 48, 0.44);
      --haze-a: rgba(40, 56, 80, 0.30);
      --haze-b: rgba(28, 36, 52, 0.26);
      --band-warm: rgba(48, 58, 78, 0.40);
      --band-cool: rgba(28, 40, 58, 0.38);
      --swell-warm: rgba(44, 58, 80, 0.38);
      --swell-cool: rgba(28, 36, 50, 0.36);
      --accent: #5a6a82;
      --ring: #3e5068;
    }

    body[data-slide="wine"] {
      --bg: #1c181c;
      --floor-top: #261e24;
      --floor-mid: #2e242c;
      --floor-bot: #1a161a;
      --ember: rgba(126, 48, 64, 0.58);
      --slate: rgba(86, 42, 58, 0.50);
      --ash: rgba(48, 34, 42, 0.44);
      --haze-a: rgba(134, 54, 50, 0.34);
      --haze-b: rgba(90, 40, 58, 0.30);
      --band-warm: rgba(116, 42, 56, 0.46);
      --band-cool: rgba(72, 38, 52, 0.40);
      --swell-warm: rgba(124, 48, 62, 0.44);
      --swell-cool: rgba(58, 36, 48, 0.38);
      --accent: #9a3e48;
      --ring: #7a3040;
    }

    body {
      transition:
        --bg 3.6s ease, --floor-top 3.6s ease, --floor-mid 3.6s ease, --floor-bot 3.6s ease,
        --ember 3.6s ease, --slate 3.6s ease, --ash 3.6s ease, --haze-a 3.6s ease,
        --haze-b 3.6s ease, --band-warm 3.6s ease, --band-cool 3.6s ease,
        --swell-warm 3.6s ease, --swell-cool 3.6s ease, --accent 3.6s ease, --ring 3.6s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body { min-height: 100dvh; }

    /* --- pixel orbit (?orbit=0 off, ?orbit=strong wider) --- */
    #orbit {
      position: relative;
      height: 100dvh;
      animation: pixel-orbit 220s ease-in-out infinite alternate;
    }

    body.orbit-strong #orbit { animation-name: pixel-orbit-strong; animation-duration: 170s; }
    body.orbit-off #orbit { animation: none; }

    /* --- luminance floor (?floor=0 restores near-void black) --- */
    .floor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(92% 72% at 50% 44%, var(--floor-mid) 0%, transparent 68%),
        linear-gradient(180deg, var(--floor-top) 0%, var(--bg) 42%, var(--floor-bot) 100%);
      filter: brightness(var(--apl));
    }

    body.floor-off {
      --bg: #08080a;
    }
    body.floor-off .floor { display: none; }

    /* APL breathe lives on .floor, not body — same-element @property
       animation + color transitions can wedge after a slide swap. */
    body.apl-on .floor { animation: apl-tick 140s ease-in-out infinite; }

    .mural {
      position: absolute;
      inset: -16%;
      pointer-events: none;
      transition: opacity 1.6s ease;
    }

    body.slide-swap .mural { opacity: 0.78; }

    .haze {
      position: absolute;
      inset: -18%;
      background:
        radial-gradient(48% 40% at 28% 38%, var(--haze-a), transparent 70%),
        radial-gradient(44% 36% at 74% 60%, var(--haze-b), transparent 68%);
      filter: blur(42px);
      opacity: 0.9;
      animation: haze-drift 38s ease-in-out infinite alternate;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      will-change: transform;
    }

    .blob.a {
      width: 84vw;
      height: 60vw;
      left: -18vw;
      top: 4vh;
      background: radial-gradient(circle at 40% 40%, var(--ember), transparent 70%);
      animation: drift-a 28s ease-in-out infinite alternate;
    }

    .blob.b {
      width: 74vw;
      height: 56vw;
      right: -20vw;
      top: -8vh;
      background: radial-gradient(circle at 50% 50%, var(--slate), transparent 70%);
      animation: drift-b 36s ease-in-out infinite alternate;
    }

    .blob.c {
      width: 96vw;
      height: 50vw;
      left: 4vw;
      bottom: -20vh;
      background: radial-gradient(circle at 50% 40%, var(--ash), transparent 72%);
      animation: drift-c 22s ease-in-out infinite alternate;
    }

    .blob.d {
      width: 58vw;
      height: 40vw;
      left: 28vw;
      top: 18vh;
      background: radial-gradient(circle at 50% 50%, var(--haze-a), transparent 72%);
      filter: blur(48px);
      animation: drift-d 44s ease-in-out infinite alternate;
    }

    .band {
      position: absolute;
      left: -18%;
      top: 20%;
      width: 136%;
      height: 46%;
      border-radius: 50%;
      filter: blur(24px);
      opacity: 0.78;
      background: linear-gradient(180deg, transparent, var(--band-warm) 48%, transparent);
      animation: swell 16s ease-in-out infinite alternate;
    }

    .band.two {
      top: auto;
      bottom: 0;
      height: 40%;
      opacity: 0.62;
      background: linear-gradient(180deg, transparent, var(--band-cool) 50%, transparent);
      animation-duration: 22s;
      animation-direction: alternate-reverse;
    }

    .band.three {
      top: 48%;
      height: 28%;
      opacity: 0.4;
      filter: blur(32px);
      background: linear-gradient(180deg, transparent, var(--haze-b) 50%, transparent);
      animation-duration: 30s;
    }

    .swell {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .swell path { filter: blur(11px); }
    .swell .warm { fill: var(--swell-warm); }
    .swell .cool { fill: var(--swell-cool); }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(118% 90% at 50% 48%, transparent 52%, rgba(14, 14, 18, 0.2) 100%);
    }

    body.floor-off .vignette {
      background: radial-gradient(115% 88% at 50% 48%, transparent 46%, rgba(0, 0, 0, 0.42) 100%);
    }

    /* --- waves: default strong; ?waves=soft old travel; ?waves=0 freeze --- */
    body.waves-soft .blob { filter: blur(36px); }
    body.waves-soft .blob.a { animation-duration: 32s; }
    body.waves-soft .blob.b { animation-duration: 40s; }
    body.waves-soft .blob.c { animation-duration: 26s; }
    body.waves-soft .haze,
    body.waves-soft .blob.d,
    body.waves-soft .band.three { opacity: 0.35; }
    body.waves-soft .band { filter: blur(26px); opacity: 0.65; animation-duration: 20s; }
    body.waves-soft .band.two { opacity: 0.5; animation-duration: 27s; }

    body.waves-off .haze,
    body.waves-off .blob,
    body.waves-off .band { animation: none; }

    .room {
      position: relative;
      z-index: 2;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 34px 24px;
    }

    .top, .bottom {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 28px;
    }

    .bottom { align-items: flex-end; }

    .brand {
      font-weight: 800;
      letter-spacing: 0.34em;
      font-size: 13px;
      color: #c4c6cc;
    }

    .brand span { color: var(--accent); }

    .tag, .hint, .note {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4e4e58;
    }

    .note {
      max-width: 46ch;
      letter-spacing: 0.05em;
      text-transform: none;
      line-height: 1.45;
      color: #4a4a54;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .ver {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #6a6a74;
    }

    a {
      color: #7a7a84;
      text-decoration: none;
    }

    a:hover { color: #c4c4cc; }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial {
      position: relative;
      width: min(58vw, 560px);
      height: min(58vw, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* --- clock/ring wander (?drift=0 off) --- */
    body.drift-on .dial {
      animation: dial-drift 190s ease-in-out infinite alternate;
    }

    .ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.78;
    }

    .ring .track {
      fill: none;
      stroke: #2a2a32;
      stroke-width: 1.2;
    }

    .ring .prog {
      fill: none;
      stroke: var(--ring);
      stroke-width: 1.6;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
    }

    /* --- soft silver clock (?silver=0 old gray) --- */
    .clock {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: clamp(56px, 8.5vw, 108px);
      font-weight: 650;
      letter-spacing: -0.045em;
      line-height: 0.92;
      font-variant-numeric: tabular-nums;
      color: var(--clock);
    }

    .clock .period {
      font-size: 0.22em;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: #8a8e96;
    }

    .date {
      position: relative;
      font-size: clamp(11px, 1.3vw, 15px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .beat {
      position: relative;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4e4e58;
      font-variant-numeric: tabular-nums;
    }

    body.silver-off {
      --clock: #c2c2c8;
      --muted: #5a5a62;
    }
    body.silver-off .clock .period { color: #7a7a82; }

    /* Modest peaks: no #fff. ?peaks=0 allows a brighter face for A/B. */
    body.peaks-off {
      --clock: #f0f2f6;
    }
    body.peaks-off .brand { color: #ececf0; }
    body.peaks-off .clock .period { color: #b0b4bc; }

    /* --- idle deeper: default gentle; ?deeper=0 off; ?deeper=crush old --- */
    body.deeper-gentle .mural { opacity: 0.94; }
    body.deeper-gentle .note,
    body.deeper-gentle .hint,
    body.deeper-gentle .ver,
    body.deeper-gentle .tag { opacity: 0.72; }

    body.deeper-crush .mural { opacity: 0.62; }
    body.deeper-crush .clock { color: #8a8a92; }
    body.deeper-crush .date { color: #4a4a52; }
    body.deeper-crush .ring { opacity: 0.45; }

    #hud {
      position: fixed;
      left: 16px;
      bottom: 10px;
      z-index: 9;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5a5a64;
      pointer-events: none;
    }

    @keyframes pixel-orbit {
      from { transform: translate3d(-6px, -5px, 0); }
      to { transform: translate3d(7px, 6px, 0); }
    }

    @keyframes pixel-orbit-strong {
      from { transform: translate3d(-11px, -9px, 0); }
      to { transform: translate3d(12px, 10px, 0); }
    }

    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(22vw, 16vh, 0) scale(1.18); }
    }

    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(-24vw, 18vh, 0) rotate(-16deg); }
    }

    @keyframes drift-c {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-16vw, -14vh, 0) scale(1.14); }
    }

    @keyframes drift-d {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(10vw, -12vh, 0) scale(1.2); }
    }

    @keyframes swell {
      from { transform: translate3d(-12vw, 10vh, 0) rotate(-6deg); }
      to { transform: translate3d(13vw, -12vh, 0) rotate(8deg); }
    }

    @keyframes haze-drift {
      from { transform: translate3d(-10vw, 6vh, 0) scale(1); }
      to { transform: translate3d(12vw, -8vh, 0) scale(1.12); }
    }

    @keyframes dial-drift {
      from { transform: translate3d(-22px, -14px, 0); }
      to { transform: translate3d(24px, 16px, 0); }
    }

    @keyframes apl-tick {
      0%, 100% { --apl: 1; }
      22% { --apl: 1.06; }
      48% { --apl: 0.99; }
      74% { --apl: 1.04; }
    }

    body.waves-soft .blob.a { animation-name: drift-a-soft; }
    body.waves-soft .blob.b { animation-name: drift-b-soft; }
    body.waves-soft .blob.c { animation-name: drift-c-soft; }
    body.waves-soft .band { animation-name: swell-soft; }

    @keyframes drift-a-soft {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(16vw, 12vh, 0) scale(1.12); }
    }
    @keyframes drift-b-soft {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(-18vw, 14vh, 0) rotate(-12deg); }
    }
    @keyframes drift-c-soft {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-12vw, -10vh, 0) scale(1.08); }
    }
    @keyframes swell-soft {
      from { transform: translate3d(-8vw, 8vh, 0) rotate(-5deg); }
      to { transform: translate3d(9vw, -10vh, 0) rotate(6deg); }
    }
  </style>
</head>

  <script>
(function () {
  const VERSION_CHECK_MS = 3 * 60 * 1000;
  const RING = 2 * Math.PI * 54;
  const SLIDES = ["ember", "slate", "wine"];

  const params = new URLSearchParams(location.search);

  const hmsEl = document.getElementById("hms");
  const ampmEl = document.getElementById("ampm");
  const dateEl = document.getElementById("date");
  const beatEl = document.getElementById("beat");
  const arcEl = document.getElementById("dayarc");
  const hudEl = document.getElementById("hud");

  let loadedVersion = null;
  let reloadArmed = false;
  let deepTimer = null;
  let slideTimer = null;
  let slideIdx = 0;

  function raw(name) {
    const v = params.get(name);
    return v == null ? null : v.toLowerCase();
  }

  function isOff(name) {
    const v = raw(name);
    return v === "0" || v === "off" || v === "false" || v === "no";
  }

  function isOn(name, fallback) {
    const v = raw(name);
    if (v == null) return fallback;
    if (v === "0" || v === "off" || v === "false" || v === "no") return false;
    if (v === "1" || v === "on" || v === "true" || v === "yes") return true;
    return true;
  }

  function numFlag(name, fallback, min) {
    const v = raw(name);
    if (v == null) return fallback;
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    if (min != null && n < min) return fallback;
    return n;
  }

  const flags = {
    floor: isOn("floor", true),
    deeper: (function () {
      const v = raw("deeper");
      if (v == null) return "gentle";
      if (v === "0" || v === "off" || v === "false" || v === "no") return "off";
      if (v === "crush" || v === "old") return "crush";
      return "gentle";
    })(),
    waves: (function () {
      const v = raw("waves");
      if (v == null) return "strong";
      if (v === "0" || v === "off") return "off";
      if (v === "soft" || v === "old") return "soft";
      return "strong";
    })(),
    orbit: (function () {
      const v = raw("orbit");
      if (v == null || v === "1" || v === "on") return "on";
      if (v === "0" || v === "off") return "off";
      if (v === "strong" || v === "2") return "strong";
      return "on";
    })(),
    silver: isOn("silver", true),
    drift: isOn("drift", true),
    peaks: isOff("peaks") ? "off" : "modest",
    slides: isOn("slides", true),
    slideDur: (function () {
      const fast = raw("slides") === "fast";
      const d = numFlag("slidedur", fast ? 12 : 180, 2);
      return d;
    })(),
    apl: isOn("apl", true),
    hud: isOn("hud", false),
    idleMs: (function () {
      const sec = raw("idle");
      if (sec == null) return 8 * 60 * 1000;
      const n = Number(sec);
      if (!Number.isFinite(n)) return 8 * 60 * 1000;
      if (n <= 0) return 0;
      return n * 1000;
    })()
  };

  function applyFlags() {
    const b = document.body;
    if (!flags.floor) b.classList.add("floor-off");
    if (flags.waves === "soft") b.classList.add("waves-soft");
    if (flags.waves === "off") b.classList.add("waves-off");
    if (flags.orbit === "off") b.classList.add("orbit-off");
    if (flags.orbit === "strong") b.classList.add("orbit-strong");
    if (!flags.silver) b.classList.add("silver-off");
    if (flags.drift) b.classList.add("drift-on");
    if (flags.peaks === "off") b.classList.add("peaks-off");
    if (flags.apl) b.classList.add("apl-on");

    const start = raw("slide");
    const startIdx = SLIDES.indexOf(start);
    slideIdx = startIdx >= 0 ? startIdx : 0;
    b.dataset.slide = SLIDES[slideIdx];
  }

  function paintHud() {
    if (!flags.hud) return;
    hudEl.hidden = false;
    hudEl.textContent = [
      document.getElementById("ver") ? document.getElementById("ver").textContent : "hearth",
      "floor:" + (flags.floor ? "on" : "off"),
      "deeper:" + flags.deeper,
      "waves:" + flags.waves,
      "orbit:" + flags.orbit,
      "silver:" + (flags.silver ? "on" : "off"),
      "drift:" + (flags.drift ? "on" : "off"),
      "peaks:" + flags.peaks,
      "slides:" + (flags.slides ? SLIDES[slideIdx] + "/" + flags.slideDur + "s" : "off"),
      "apl:" + (flags.apl ? "on" : "off"),
      "swipe:" + (document.documentElement.getAttribute("data-deck") || "off")
    ].join("  ·  ");
  }

  function nextSlide() {
    if (!flags.slides) return;
    slideIdx = (slideIdx + 1) % SLIDES.length;
    document.body.classList.add("slide-swap");
    document.body.dataset.slide = SLIDES[slideIdx];
    paintHud();
    window.setTimeout(function () {
      document.body.classList.remove("slide-swap");
    }, 1600);
  }

  function armSlides() {
    if (!flags.slides) return;
    if (slideTimer) clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, flags.slideDur * 1000);
  }

  function chicagoParts(d) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      weekday: "long",
      month: "long",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true,
      hourCycle: "h12"
    });
    const map = {};
    fmt.formatToParts(d).forEach(function (p) {
      if (p.type !== "literal") map[p.type] = p.value;
    });
    return map;
  }

  function dayFraction(d) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago",
      hour: "numeric",
      minute: "numeric",
      second: "numeric",
      hourCycle: "h23"
    });
    const map = {};
    fmt.formatToParts(d).forEach(function (p) {
      if (p.type !== "literal") map[p.type] = Number(p.value);
    });
    const sec = (map.hour || 0) * 3600 + (map.minute || 0) * 60 + (map.second || 0);
    return sec / 86400;
  }

  function paint() {
    const d = new Date();
    const p = chicagoParts(d);
    const day = (p.dayPeriod || "").toUpperCase();
    hmsEl.textContent = (p.hour || "—") + ":" + (p.minute || "00") + ":" + (p.second || "00");
    ampmEl.textContent = day || "";
    dateEl.textContent = ((p.weekday || "") + "  ·  " + (p.month || "") + " " + (p.day || "")).toUpperCase();
    const frac = dayFraction(d);
    arcEl.style.strokeDashoffset = String(RING * (1 - frac));
    beatEl.textContent = "day  ·  " + Math.round(frac * 100) + "%";
  }

  function clearDeeper() {
    document.body.classList.remove("deeper-gentle", "deeper-crush");
  }

  function armDeep() {
    if (deepTimer) clearTimeout(deepTimer);
    clearDeeper();
    if (flags.deeper === "off" || flags.idleMs <= 0) return;
    deepTimer = setTimeout(function () {
      document.body.classList.add(flags.deeper === "crush" ? "deeper-crush" : "deeper-gentle");
    }, flags.idleMs);
  }

  ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"].forEach(function (type) {
    window.addEventListener(type, armDeep, { passive: true });
  });

  function versionCheckMs() {
    try {
      const n = numFlag("vcheck", VERSION_CHECK_MS, 1000);
      return n;
    } catch (e) {}
    return VERSION_CHECK_MS;
  }

  function paintStamp(data) {
    const el = document.getElementById("ver");
    if (!el || !data || !data.label) return;
    const name = el.getAttribute("data-portal") || "HEARTH";
    el.textContent = name + " " + data.label;
  }

  async function fetchVersion() {
    const url = "./version.json?t=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || typeof data.v !== "string" || !data.v) throw new Error("bad version");
    paintStamp(data);
    return data.v;
  }

  async function captureVersion() {
    try { loadedVersion = await fetchVersion(); } catch (e) { loadedVersion = null; }
  }

  async function checkVersion() {
    if (reloadArmed) return;
    try {
      const remote = await fetchVersion();
      if (loadedVersion == null) { loadedVersion = remote; return; }
      if (remote !== loadedVersion) {
        reloadArmed = true;
        location.reload();
      }
    } catch (e) {}
  }

  applyFlags();
  paintHud();
  paint();
  setInterval(paint, 1000);
  armDeep();
  armSlides();
  captureVersion();
  setInterval(checkVersion, versionCheckMs());
})();
  </script>
</body>
</html>
